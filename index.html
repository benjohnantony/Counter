<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Workout Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /*
     * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     *  FIGMA WORKOUT TIMER V2 (Section ID: 56:794 · HOME PAGE: 56:2111)
     *  Brutalist Athletic High-Contrast Theme
     * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Colors directly from Figma Workout Timer v2 */
      --bg:                   #000000; /* Deep black surface */
      --card-surface:         #000000;
      --card-border:          #FFFFFF; /* 1px crisp white border */
      --control-border:       #303038;
      --accent-green:         #99FF44; /* Neon lime */
      --accent-red:           #F13629; /* Vibrant red */
      --accent-red-header:    #F1372A; /* Settings header block */
      --stop-red:             #FF003B;
      --primary-accent:       #99FF44; /* Main Action & Selected Tabs */
      --white:                #FFFFFF;
      --primary-text:         #F5F5F7;
      --text-black:           #000000;
      --secondary-text:       #9E9E9F;
      --muted-text:           #727287;
      --close-btn-surface:    #000000;

      /* Category indicators */
      --cat-sets:             #99FF44;
      --cat-rest-sets:        #2196F3;
      --cat-reps:             #F13629;
      --cat-rest-reps:        #FFAB00;
      --cat-hold:             #A62CC6;

      /* Typography */
      --font-heading:         'Anton', sans-serif;
      --font-body:            'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* Radii */
      --r-none:               0px;
      --r-xs:                 4px;
      --r-pill:               360px;

      --transition:           0.15s ease;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--primary-text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      background: var(--bg);
    }

    /* ── Mobile-First Container (Figma 375 × 833 px) ────────────── */
    .card {
      width: 100%;
      max-width: 420px;
      height: 733px;
      max-height: calc(100dvh - 32px);
      margin: 0 auto;
      background: var(--bg);
      border-radius: var(--r-none);
      border: 1px solid #222227;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-sizing: border-box;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
    }

    /* ── Group A: Header (Figma v2 Frame 1707479701: 375 × 83 px) ─── */
    .header {
      width: 100%;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .header-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .header-text h1 {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: 24px;
      line-height: 24px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--white);
    }

    .header-text p {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 12px;
      line-height: 14px;
      letter-spacing: 0.4px;
      color: var(--muted-text);
    }

    .settings-btn {
      width: 52px;
      height: 52px;
      border-radius: var(--r-none);
      background: var(--accent-red-header); /* #F1372A */
      border: none;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      text-decoration: none;
      color: var(--white) !important;
      transition: opacity var(--transition);
    }

    .settings-btn:hover {
      opacity: 0.9;
    }

    .settings-btn svg {
      width: 22px;
      height: 22px;
      stroke: var(--white);
      stroke-width: 2;
    }

    /* ── Group B: Exercise Tabs (Height 40 px, Gap 12 px) ────────── */
    .tabs {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      overflow-y: hidden;
      width: 100%;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex-shrink: 0;
      cursor: grab;
      margin: 0 0 24px 0;
    }

    .tabs:active {
      cursor: grabbing;
    }

    .tabs::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .tab-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .tab {
      height: 40px;
      border-radius: var(--r-none);
      background: var(--bg);
      border: 1px solid var(--control-border);
      padding: 8px 12px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all var(--transition);
    }

    .tab span.tab-title {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: 16px;
      line-height: 20px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted-text);
    }

    .tab:hover {
      border-color: #555562;
    }

    /* Selected Tab (Fill: #99FF44, Text: #000000, Anton 16px) */
    .tab.active {
      background: var(--accent-green); /* #99FF44 */
      border: 1px solid var(--accent-green);
    }

    .tab.active span.tab-title {
      color: var(--text-black);
    }

    /* Dismiss button: 24 × 24 px circular, fill #000000 */
    .tab-remove {
      display: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--close-btn-surface);
      border: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--primary-text);
      transition: background var(--transition);
      flex-shrink: 0;
    }

    .tab.active .tab-remove {
      color: var(--white);
    }

    .tab-remove:hover {
      background: rgba(0, 0, 0, 0.7);
    }

    .tab.has-remove .tab-remove {
      display: inline-flex;
    }

    .tab-remove svg {
      width: 12px;
      height: 12px;
      display: block;
    }

    /* Add Tab Button: 40 × 40 px, fill #000000, 1px #303038 */
    .tab-add {
      width: 40px;
      height: 40px;
      border-radius: var(--r-none);
      background: var(--bg);
      border: 1px solid var(--control-border);
      flex-shrink: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--white);
      transition: all var(--transition);
    }

    .tab-add:hover {
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .tab-add svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    /* ── Group C: Parameter Cards (Figma v2: 1px solid #FFFFFF, sharp) ── */
    .params {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
      margin: 0 0 28px 0;
    }

    .param-row {
      width: 100%;
      min-height: 76px;
      background: var(--card-surface); /* #000000 */
      border-radius: var(--r-none);
      border: 1px solid var(--card-border); /* 1px solid #FFFFFF from Figma v2 */
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: none;
      box-sizing: border-box;
      gap: 12px;
    }

    .param-label-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .param-marker-col {
      width: 6px;
      height: 40px;
      display: flex;
      align-items: flex-start;
      flex-shrink: 0;
    }

    .category-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-top: 8px;
      flex-shrink: 0;
    }

    .param-text-stack {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }

    .param-text-stack strong {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: 16px;
      line-height: 22px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--primary-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .param-text-stack span {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 12px;
      line-height: 14px;
      letter-spacing: 0.4px;
      color: var(--muted-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Stepper (Figma v2: 98 × 48 px, Fill #F13629, 1px #303038) ─── */
    .stepper {
      width: 98px;
      height: 48px;
      background: var(--accent-red); /* #F13629 from Figma v2 */
      border: 1px solid var(--control-border);
      border-radius: var(--r-none);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      flex-shrink: 0;
      box-sizing: border-box;
      transition: filter var(--transition);
    }

    .stepper:hover {
      filter: brightness(1.08);
    }

    .stepper-btn {
      width: 20px;
      height: 20px;
      background: transparent;
      border: none;
      padding: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--white);
      transition: opacity var(--transition);
      user-select: none;
      touch-action: manipulation;
      flex-shrink: 0;
    }

    .stepper-btn:hover {
      opacity: 0.8;
    }

    .stepper-btn svg {
      width: 14px;
      height: 14px;
      display: block;
      stroke: currentColor;
    }

    .stepper-input {
      width: 32px;
      height: 40px;
      background: transparent;
      border: none;
      outline: none;
      text-align: center;
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: 20px;
      line-height: 20px;
      letter-spacing: 0.4px;
      color: var(--primary-text);
      padding: 0;
      -moz-appearance: textfield;
      user-select: all;
    }

    .stepper-input::-webkit-outer-spin-button,
    .stepper-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* ── Switch (Figma v2: 52 × 28 px, Fill #99FF44, Thumb 20 × 20 px) ── */
    .switch-wrap {
      width: 52px;
      height: 28px;
      position: relative;
      flex-shrink: 0;
    }

    .switch-pill {
      position: relative;
      display: block;
      width: 52px;
      height: 28px;
      cursor: pointer;
      user-select: none;
    }

    .switch-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      width: 52px;
      height: 28px;
      border-radius: var(--r-pill);
      background: #1B1B1F;
      border: 1px solid var(--control-border);
      transition: background var(--transition), border-color var(--transition);
      box-sizing: border-box;
      overflow: hidden;
    }

    .switch-sound-icon {
      position: absolute;
      left: 6px;
      top: 7px;
      width: 13px;
      height: 13px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity var(--transition);
    }

    .switch-sound-icon svg {
      width: 13px;
      height: 13px;
      display: block;
    }

    .switch-thumb {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--white);
      top: 3px;
      left: 3px;
      transition: transform var(--transition);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }

    .switch-input:checked + .switch-track {
      background: var(--accent-green); /* #99FF44 */
      border-color: var(--accent-green);
    }

    .switch-input:checked + .switch-track .switch-thumb {
      transform: translateX(24px);
    }

    .switch-input:checked + .switch-track .switch-sound-icon {
      opacity: 1;
      color: #000000;
    }

    .switch-input:not(:checked) + .switch-track .switch-sound-icon {
      opacity: 0.35;
    }

    /* ── Group D: CTA Button (Figma v2: Fill #99FF44, Text #000000, Anton 20px) ── */
    .start-btn-wrap {
      width: 100%;
      height: 56px;
      flex-shrink: 0;
      margin-top: auto;
    }

    .start-btn {
      width: 100%;
      height: 56px;
      background: var(--accent-green); /* #99FF44 */
      border-radius: var(--r-none);
      border: none;
      box-shadow: none;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
    }

    .start-btn:hover {
      opacity: 0.94;
    }

    .start-btn:active {
      transform: scale(0.99);
    }

    /* Play Icon: in Black */
    .start-btn svg {
      width: 16px;
      height: 18px;
      display: block;
      flex-shrink: 0;
      fill: var(--text-black);
    }

    /* Label: Start Workout, Anton 20px, Black */
    .start-btn span {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: 20px;
      line-height: 20px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-black);
    }

    /* ── Mobile Viewports ────────────────────────────────────────── */
    @media (max-width: 520px) {
      body {
        padding: 0;
        align-items: flex-start;
      }
      .card {
        border-radius: 0;
        border: none;
        max-width: 100%;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        max-height: 100dvh;
        margin: 0 auto;
        padding: 24px 16px;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

<main class="card" aria-label="Workout Timer Configuration">

  <!-- Group A: Header (333 × 47 px) -->
  <header class="header">
    <div class="header-text">
      <h1>Workout Timer</h1>
      <p>Set your intervals and start</p>
    </div>
    <a href="settings.html" class="settings-btn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </a>
  </header>

  <!-- Group B: Exercise Tabs (Height 40 px) -->
  <nav class="tabs" id="tabs-container" role="tablist" aria-label="Exercise Tabs">
    <div class="tab-wrapper" data-tab-id="1">
      <button class="tab active" role="tab" aria-selected="true" data-tab="1">
        <span class="tab-title">Exercise 1</span>
        <span class="tab-remove" title="Remove Exercise" aria-label="Remove Exercise">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M5 5L11 11M11 5L5 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
      </button>
    </div>
    <button class="tab-add" id="tab-add-btn" aria-label="Add Exercise" title="Add Exercise">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </nav>

  <!-- Group C: Setting Cards (5 Cards, each 72 px, Gap 16 px) -->
  <section class="params" id="params" aria-label="Workout Parameters">

    <!-- 1. Sets (Green #4CAF50) -->
    <div class="param-row">
      <div class="param-label-group">
        <div class="param-marker-col">
          <span class="category-dot" style="background: var(--cat-sets);" aria-hidden="true"></span>
        </div>
        <div class="param-text-stack">
          <strong>Sets</strong>
          <span>Number of sets</span>
        </div>
      </div>
      <div class="stepper" aria-label="Sets stepper">
        <button class="stepper-btn" data-target="sets" data-dir="-1" aria-label="Decrease sets">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3.5 8h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <input type="number" class="stepper-input" id="sets-val" value="3" min="1" max="99" aria-label="Sets value" />
        <button class="stepper-btn" data-target="sets" data-dir="1" aria-label="Increase sets">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="switch-wrap">
        <label class="switch-pill" aria-label="Toggle voice for Sets">
          <input class="switch-input" id="sound-sets" type="checkbox" checked />
          <span class="switch-track">
            <span class="switch-sound-icon">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M6 3.5L3.5 5.5H1.5v5h2L6 12.5V3.5z" stroke="#F5F5F7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 5.5a3.5 3.5 0 0 1 0 5" stroke="#F5F5F7" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="switch-thumb"></span>
          </span>
        </label>
      </div>
    </div>

    <!-- 2. Rest between Sets (Blue #2196F3) -->
    <div class="param-row">
      <div class="param-label-group">
        <div class="param-marker-col">
          <span class="category-dot" style="background: var(--cat-rest-sets);" aria-hidden="true"></span>
        </div>
        <div class="param-text-stack">
          <strong>Rest between Sets</strong>
          <span>Time between sets (sec)</span>
        </div>
      </div>
      <div class="stepper" aria-label="Rest between sets stepper">
        <button class="stepper-btn" data-target="rest-sets" data-dir="-1" aria-label="Decrease rest between sets">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3.5 8h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <input type="number" class="stepper-input" id="rest-sets-val" value="30" min="0" max="600" aria-label="Rest between sets value" />
        <button class="stepper-btn" data-target="rest-sets" data-dir="1" aria-label="Increase rest between sets">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="switch-wrap">
        <label class="switch-pill" aria-label="Toggle voice for Rest between Sets">
          <input class="switch-input" id="sound-rest-sets" type="checkbox" checked />
          <span class="switch-track">
            <span class="switch-sound-icon">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M6 3.5L3.5 5.5H1.5v5h2L6 12.5V3.5z" stroke="#F5F5F7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 5.5a3.5 3.5 0 0 1 0 5" stroke="#F5F5F7" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="switch-thumb"></span>
          </span>
        </label>
      </div>
    </div>

    <!-- 3. Reps Per Set (Red #FF4747) -->
    <div class="param-row">
      <div class="param-label-group">
        <div class="param-marker-col">
          <span class="category-dot" style="background: var(--cat-reps);" aria-hidden="true"></span>
        </div>
        <div class="param-text-stack">
          <strong>Reps Per Set</strong>
          <span>Number of reps per set</span>
        </div>
      </div>
      <div class="stepper" aria-label="Reps per set stepper">
        <button class="stepper-btn" data-target="reps" data-dir="-1" aria-label="Decrease reps">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3.5 8h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <input type="number" class="stepper-input" id="reps-val" value="10" min="1" max="99" aria-label="Reps value" />
        <button class="stepper-btn" data-target="reps" data-dir="1" aria-label="Increase reps">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="switch-wrap">
        <label class="switch-pill" aria-label="Toggle voice for Reps Per Set">
          <input class="switch-input" id="sound-reps" type="checkbox" checked />
          <span class="switch-track">
            <span class="switch-sound-icon">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M6 3.5L3.5 5.5H1.5v5h2L6 12.5V3.5z" stroke="#F5F5F7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 5.5a3.5 3.5 0 0 1 0 5" stroke="#F5F5F7" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="switch-thumb"></span>
          </span>
        </label>
      </div>
    </div>

    <!-- 4. Rest between Reps (Amber #FFAB00) -->
    <div class="param-row">
      <div class="param-label-group">
        <div class="param-marker-col">
          <span class="category-dot" style="background: var(--cat-rest-reps);" aria-hidden="true"></span>
        </div>
        <div class="param-text-stack">
          <strong>Rest between Reps</strong>
          <span>Time between reps (sec)</span>
        </div>
      </div>
      <div class="stepper" aria-label="Rest between reps stepper">
        <button class="stepper-btn" data-target="rest-reps" data-dir="-1" aria-label="Decrease rest between reps">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3.5 8h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <input type="number" class="stepper-input" id="rest-reps-val" value="5" min="0" max="300" aria-label="Rest between reps value" />
        <button class="stepper-btn" data-target="rest-reps" data-dir="1" aria-label="Increase rest between reps">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="switch-wrap">
        <label class="switch-pill" aria-label="Toggle voice for Rest between Reps">
          <input class="switch-input" id="sound-rest-reps" type="checkbox" checked />
          <span class="switch-track">
            <span class="switch-sound-icon">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M6 3.5L3.5 5.5H1.5v5h2L6 12.5V3.5z" stroke="#F5F5F7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 5.5a3.5 3.5 0 0 1 0 5" stroke="#F5F5F7" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="switch-thumb"></span>
          </span>
        </label>
      </div>
    </div>

    <!-- 5. Hold Time (Purple #A62CC6) -->
    <div class="param-row">
      <div class="param-label-group">
        <div class="param-marker-col">
          <span class="category-dot" style="background: var(--cat-hold);" aria-hidden="true"></span>
        </div>
        <div class="param-text-stack">
          <strong>Hold Time</strong>
          <span>Time to hold each rep (sec)</span>
        </div>
      </div>
      <div class="stepper" aria-label="Hold time stepper">
        <button class="stepper-btn" data-target="hold" data-dir="-1" aria-label="Decrease hold time">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3.5 8h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <input type="number" class="stepper-input" id="hold-val" value="10" min="0" max="300" aria-label="Hold time value" />
        <button class="stepper-btn" data-target="hold" data-dir="1" aria-label="Increase hold time">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="switch-wrap">
        <label class="switch-pill" aria-label="Toggle voice for Hold Time">
          <input class="switch-input" id="sound-hold" type="checkbox" checked />
          <span class="switch-track">
            <span class="switch-sound-icon">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M6 3.5L3.5 5.5H1.5v5h2L6 12.5V3.5z" stroke="#F5F5F7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 5.5a3.5 3.5 0 0 1 0 5" stroke="#F5F5F7" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="switch-thumb"></span>
          </span>
        </label>
      </div>
    </div>

  </section>

  <!-- Group D: CTA Button (333 × 48 px, Fill #FE3B68) -->
  <footer class="start-btn-wrap">
    <button class="start-btn" id="start-btn" aria-label="Start Workout">
      <svg viewBox="0 0 13 16" fill="none" aria-hidden="true">
        <path d="M12.1 7.14a1 1 0 0 1 0 1.72L2.1 14.86A1 1 0 0 1 0.5 14V2a1 1 0 0 1 1.6-.86l10 6z" fill="#FFFFFF"/>
      </svg>
      <span>Start Workout</span>
    </button>
  </footer>

</main>

<script>
  // ── State ────────────────────────────────────────────────────
  const state = {
    sets:        { value: 3,  min: 1, max: 99  },
    'rest-sets': { value: 30, min: 0, max: 600 },
    reps:        { value: 10, min: 1, max: 99  },
    'rest-reps': { value: 5,  min: 0, max: 300 },
    hold:        { value: 10, min: 0, max: 300 },
  };

  const STORAGE_KEY = 'workout_timer_saved_config';

  // ── Persistence Helpers ──────────────────────────────────────
  function saveConfig() {
    try {
      const exerciseCount = tabsContainer.querySelectorAll('.tab-wrapper').length;
      const config = {
        sets:          state['sets'].value,
        restSets:      state['rest-sets'].value,
        reps:          state['reps'].value,
        restReps:      state['rest-reps'].value,
        hold:          state['hold'].value,
        exerciseCount: Math.max(1, exerciseCount),
        soundSets:     document.getElementById('sound-sets').checked,
        soundRestSets: document.getElementById('sound-rest-sets').checked,
        soundReps:     document.getElementById('sound-reps').checked,
        soundRestReps: document.getElementById('sound-rest-reps').checked,
        soundHold:     document.getElementById('sound-hold').checked,
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
    } catch (e) {
      console.warn('Failed to save config to localStorage:', e);
    }
  }

  function loadConfig() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const cfg = JSON.parse(raw);

      if (typeof cfg.sets === 'number')      updateValue('sets', cfg.sets);
      if (typeof cfg.restSets === 'number')  updateValue('rest-sets', cfg.restSets);
      if (typeof cfg.reps === 'number')      updateValue('reps', cfg.reps);
      if (typeof cfg.restReps === 'number')  updateValue('rest-reps', cfg.restReps);
      if (typeof cfg.hold === 'number')      updateValue('hold', cfg.hold);

      if (cfg.soundSets !== undefined)     document.getElementById('sound-sets').checked     = !!cfg.soundSets;
      if (cfg.soundRestSets !== undefined) document.getElementById('sound-rest-sets').checked = !!cfg.soundRestSets;
      if (cfg.soundReps !== undefined)     document.getElementById('sound-reps').checked     = !!cfg.soundReps;
      if (cfg.soundRestReps !== undefined) document.getElementById('sound-rest-reps').checked = !!cfg.soundRestReps;
      if (cfg.soundHold !== undefined)     document.getElementById('sound-hold').checked     = !!cfg.soundHold;

      // Restore saved exercise tabs
      if (cfg.exerciseCount && cfg.exerciseCount > 1) {
        tabsContainer.querySelectorAll('.tab-wrapper').forEach(w => w.remove());
        for (let i = 1; i <= cfg.exerciseCount; i++) {
          createExerciseTab(i, i === 1);
        }
        updateRemoveButtons();
      }
    } catch (e) {
      console.warn('Failed to load config from localStorage:', e);
    }
  }

  // ── Helper to Update and Sync Stepper Value ───────────────────
  function updateValue(target, newVal) {
    const s = state[target];
    if (!s) return;
    const clamped = Math.min(s.max, Math.max(s.min, newVal));
    s.value = clamped;
    const input = document.getElementById(`${target}-val`);
    if (input && parseInt(input.value, 10) !== clamped) {
      input.value = clamped;
    }
    saveConfig();
  }

  function stepOnce(target, dir) {
    updateValue(target, state[target].value + dir);
  }

  // ── Stepper Press & Hold for High Speed Acceleration ─────────
  let holdTimer = null;
  let holdInterval = null;

  function startHoldStep(target, dir) {
    stepOnce(target, dir);

    holdTimer = setTimeout(() => {
      holdInterval = setInterval(() => {
        stepOnce(target, dir);
      }, 60);
    }, 350);
  }

  function stopHoldStep() {
    if (holdTimer)    { clearTimeout(holdTimer);   holdTimer = null; }
    if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
  }

  document.querySelectorAll('.stepper-btn').forEach(btn => {
    const target = btn.dataset.target;
    const dir    = parseInt(btn.dataset.dir, 10);

    // Mouse events
    btn.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      startHoldStep(target, dir);
    });
    btn.addEventListener('mouseup', stopHoldStep);
    btn.addEventListener('mouseleave', stopHoldStep);

    // Touch events for mobile
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startHoldStep(target, dir);
    }, { passive: false });
    btn.addEventListener('touchend', stopHoldStep);
    btn.addEventListener('touchcancel', stopHoldStep);
  });

  // ── Direct Stepper Input Editing ──────────────────────────────
  document.querySelectorAll('.stepper-input').forEach(input => {
    const id = input.id.replace('-val', '');

    input.addEventListener('input', () => {
      let v = parseInt(input.value, 10);
      if (isNaN(v)) return;
      updateValue(id, v);
    });

    input.addEventListener('blur', () => {
      let v = parseInt(input.value, 10);
      if (isNaN(v)) {
        input.value = state[id].value;
      } else {
        updateValue(id, v);
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        stepOnce(id, 1);
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        stepOnce(id, -1);
      } else if (e.key === 'Enter') {
        input.blur();
      }
    });
  });

  // ── Track Sound Switch Changes ────────────────────────────────
  document.querySelectorAll('.switch-input').forEach(sw => {
    sw.addEventListener('change', saveConfig);
  });

  // ── Exercise Tabs Management ──────────────────────────────────
  const tabsContainer = document.getElementById('tabs-container');
  const tabAddBtn     = document.getElementById('tab-add-btn');

  function createExerciseTab(num, isActive = false) {
    const newWrapper = document.createElement('div');
    newWrapper.className = 'tab-wrapper';
    newWrapper.dataset.tabId = num;

    const newTab = document.createElement('button');
    newTab.className = `tab ${isActive ? 'active' : ''}`;
    newTab.role = 'tab';
    newTab.setAttribute('aria-selected', isActive ? 'true' : 'false');
    newTab.dataset.tab = num;
    newTab.innerHTML = `
      <span class="tab-title">Exercise ${num}</span>
      <span class="tab-remove" title="Remove Exercise" aria-label="Remove Exercise">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M5 5L11 11M11 5L5 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </span>`;

    newWrapper.appendChild(newTab);
    tabsContainer.insertBefore(newWrapper, tabAddBtn);
    return newTab;
  }

  function updateRemoveButtons() {
    const wrappers = tabsContainer.querySelectorAll('.tab-wrapper');
    wrappers.forEach(w => {
      const tab = w.querySelector('.tab');
      if (wrappers.length > 1) {
        tab.classList.add('has-remove');
      } else {
        tab.classList.remove('has-remove');
      }
    });
  }

  function renumberTabs() {
    const wrappers = tabsContainer.querySelectorAll('.tab-wrapper');
    wrappers.forEach((w, index) => {
      const num = index + 1;
      w.dataset.tabId = num;
      const btn = w.querySelector('.tab');
      btn.dataset.tab = num;
      btn.querySelector('.tab-title').textContent = `Exercise ${num}`;
    });
    updateRemoveButtons();
    saveConfig();
  }

  function setActiveTab(tabBtn) {
    tabsContainer.querySelectorAll('.tab').forEach(t => {
      t.classList.remove('active');
      t.setAttribute('aria-selected', 'false');
    });
    tabBtn.classList.add('active');
    tabBtn.setAttribute('aria-selected', 'true');
  }

  // Setup tab click delegation
  tabsContainer.addEventListener('click', (e) => {
    const removeBtn = e.target.closest('.tab-remove');
    if (removeBtn) {
      e.stopPropagation();
      const wrapper = removeBtn.closest('.tab-wrapper');
      const wasActive = wrapper.querySelector('.tab').classList.contains('active');
      wrapper.remove();
      renumberTabs();
      if (wasActive) {
        const firstTab = tabsContainer.querySelector('.tab');
        if (firstTab) setActiveTab(firstTab);
      }
      saveConfig();
      return;
    }

    const tabBtn = e.target.closest('.tab');
    if (tabBtn && tabBtn.dataset.tab) {
      setActiveTab(tabBtn);
    }
  });

  // ── Smooth Mouse Wheel Horizontal Scrolling ───────────────────
  tabsContainer.addEventListener('wheel', (e) => {
    if (e.deltaY !== 0) {
      e.preventDefault();
      tabsContainer.scrollLeft += e.deltaY * 0.9;
    }
  }, { passive: false });

  // ── Click & Drag Horizontal Scrolling for Desktop ─────────────
  let isDown = false;
  let startX = 0;
  let scrollLeft = 0;
  let hasMoved = false;

  tabsContainer.addEventListener('mousedown', (e) => {
    if (e.target.closest('.tab-remove') || e.target.closest('.tab-add')) return;
    isDown = true;
    hasMoved = false;
    startX = e.pageX - tabsContainer.offsetLeft;
    scrollLeft = tabsContainer.scrollLeft;
  });

  tabsContainer.addEventListener('mouseleave', () => { isDown = false; });
  tabsContainer.addEventListener('mouseup', () => {
    setTimeout(() => { isDown = false; hasMoved = false; }, 50);
  });

  tabsContainer.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    const x = e.pageX - tabsContainer.offsetLeft;
    const walk = (x - startX) * 1.4;
    if (Math.abs(walk) > 4) {
      hasMoved = true;
    }
    tabsContainer.scrollLeft = scrollLeft - walk;
  });

  // Add Exercise Tab
  tabAddBtn.addEventListener('click', () => {
    const wrappers = tabsContainer.querySelectorAll('.tab-wrapper');
    const newNum = wrappers.length + 1;
    const newTab = createExerciseTab(newNum, true);

    setActiveTab(newTab);
    updateRemoveButtons();
    newTab.scrollIntoView({ behavior: 'smooth', inline: 'nearest' });
    saveConfig();
  });

  updateRemoveButtons();

  // ── Restore Previous Exercise Values ──────────────────────────
  loadConfig();

  // ── Start Workout Button ──────────────────────────────────────
  document.getElementById('start-btn').addEventListener('click', () => {
    saveConfig();
    const exerciseCount = tabsContainer.querySelectorAll('.tab-wrapper').length;

    const soundSets     = document.getElementById('sound-sets').checked ? '1' : '0';
    const soundRestSets = document.getElementById('sound-rest-sets').checked ? '1' : '0';
    const soundReps     = document.getElementById('sound-reps').checked ? '1' : '0';
    const soundRestReps = document.getElementById('sound-rest-reps').checked ? '1' : '0';
    const soundHold     = document.getElementById('sound-hold').checked ? '1' : '0';

    const p = new URLSearchParams({
      sets:          state['sets'].value,
      reps:          state['reps'].value,
      restSets:      state['rest-sets'].value,
      restReps:      state['rest-reps'].value,
      hold:          state['hold'].value,
      exercises:     exerciseCount,
      soundSets,
      soundRestSets,
      soundReps,
      soundRestReps,
      soundHold,
    });

    location.href = `timer.html?${p.toString()}`;
  });
</script>

</body>
</html>
