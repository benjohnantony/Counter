<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Workout Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /*
     * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     *  FIGMA WORKOUT TIMER V2 (Node ID: 59:2387)
     *  Pixel-Perfect High-Contrast Athletic Brutalist Theme
     * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:                   #000000;
      --accent-green:         #99FF44; /* Neon volt green */
      --accent-red:           #F13629; /* Vibrant red */
      --accent-red-header:    #F1372A; /* Settings header block */
      --white:                #FFFFFF;
      --text-black:           #000000;
      --text-grey:            #9E9E9F;
      --border-dark:          #1B1B1F;

      /* Typography */
      --font-heading:         'Anton', sans-serif;
      --font-body:            'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      --transition:           0.12s ease;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0;
      background: var(--bg);
    }

    /* ── Mobile Container (Figma 375 × 833 px) ───────────────────── */
    .card {
      width: 100%;
      max-width: 375px;
      height: 833px;
      margin: 0 auto;
      background: var(--bg);
      border: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    /* ── Top Section: 167px Neon Green Background (#99FF44) ─────── */
    .top-section-home {
      width: 100%;
      height: 167px;
      min-height: 167px;
      background: var(--accent-green);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* ── Group A: Header Bar (375 × 83 px) ────────────────────────── */
    .header {
      width: 100%;
      height: 83px;
      min-height: 83px;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--accent-green);
    }

    .header-text {
      flex: 1;
      display: flex;
      align-items: center;
      padding-left: 20px;
    }

    .header-text h1 {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: 26px;
      line-height: 26px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-black);
      margin: 0;
    }

    .settings-btn {
      width: 94px;
      height: 83px;
      background: var(--accent-red-header);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      text-decoration: none;
      color: var(--white) !important;
      transition: opacity var(--transition);
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .settings-btn:hover {
      opacity: 0.92;
    }

    .settings-btn:active {
      opacity: 0.85;
    }

    .settings-btn svg {
      width: 32px;
      height: 32px;
      stroke: var(--white);
      stroke-width: 2.2;
    }

    /* ── Group B: Workout Tabs (375 × 84 px) ─────────────────────── */
    .tabs-bar {
      width: 100%;
      height: 84px;
      min-height: 84px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      margin: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex-shrink: 0;
      background: var(--accent-green);
    }

    .tabs-bar::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .tab-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .tab {
      height: 40px;
      background: #000000;
      border: none;
      border-radius: 0;
      padding: 8px 16px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: all var(--transition);
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .tab span.tab-title {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: 16px;
      line-height: 20px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--white);
    }

    /* Selected Active Tab (Fill: #F13629 Crimson Red, Text: #FFFFFF Anton 16px) */
    .tab.active {
      background: var(--accent-red);
      border: none;
    }

    .tab.active span.tab-title {
      color: var(--white);
    }

    /* Dismiss button: 20 × 20 px circular, fill #000000 */
    .tab-remove {
      display: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      border: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--white);
      flex-shrink: 0;
      padding: 0;
    }

    .tab.has-remove .tab-remove {
      display: inline-flex;
    }

    .tab-remove:hover {
      background: rgba(0, 0, 0, 0.7);
    }

    .tab-remove svg {
      width: 8px;
      height: 8px;
      display: block;
      stroke: #FFFFFF;
      stroke-width: 2;
    }

    /* Add Tab Button: 40 × 40 px, fill #000000, white plus icon */
    .tab-add {
      width: 40px;
      height: 40px;
      border-radius: 0;
      background: #000000;
      border: none;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--white);
      transition: opacity var(--transition);
      -webkit-tap-highlight-color: transparent;
    }

    .tab-add:hover {
      opacity: 0.85;
    }

    .tab-add svg {
      width: 14px;
      height: 14px;
      display: block;
      stroke: #FFFFFF;
      stroke-width: 2.2;
    }

    /* ── Group C: Parameter Cards (5 Cards, each 116 px, height 583 px) ─ */
    .params {
      flex: 1;
      height: 583px;
      display: flex;
      flex-direction: column;
      padding: 0;
      margin: 0;
      background: #000000;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      box-sizing: border-box;
    }

    .params::-webkit-scrollbar {
      display: none;
    }

    .card-row {
      width: 100%;
      height: 116px;
      min-height: 116px;
      background: #000000;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      align-items: stretch;
      position: relative;
      box-sizing: border-box;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Left and Right 50% hit zones: clicking anywhere near right increases, left decreases */
    .card-action-btn {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0 28px;
      color: var(--white);
      transition: background var(--transition);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .card-action-btn:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .card-action-btn.minus {
      justify-content: flex-start;
    }

    .card-action-btn.plus {
      justify-content: flex-end;
    }

    /* Minus glyph bar (18 × 2.5 px) */
    .glyph-minus {
      display: block;
      width: 18px;
      height: 2.5px;
      background: var(--white);
      border-radius: 1px;
      pointer-events: none;
    }

    /* Plus glyph cross (18 × 18 px) */
    .glyph-plus {
      display: block;
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .glyph-plus svg {
      width: 18px;
      height: 18px;
      display: block;
      stroke: var(--white);
      stroke-width: 2.5;
      stroke-linecap: square;
    }

    /* Center Content Stack: Label (Anton 15px #9E9E9F) & Value (Anton 40px #FFFFFF) */
    .card-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      width: 240px;
      max-width: 250px;
    }

    .card-label {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: 14px;
      line-height: 16px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-grey);
      white-space: nowrap;
    }

    .card-value {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: 40px;
      line-height: 40px;
      letter-spacing: 0.5px;
      color: var(--white);
      font-variant-numeric: tabular-nums;
    }

    /* ── Group D: CTA Start Button (375 × 83 px, Fill: #99FF44) ──── */
    .start-btn-wrap {
      width: 100%;
      height: 83px;
      min-height: 83px;
      flex-shrink: 0;
      margin: 0;
      padding: 0;
      background: var(--accent-green);
    }

    .start-btn {
      width: 100%;
      height: 83px;
      background: var(--accent-green);
      border: none;
      box-shadow: none;
      padding: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: opacity var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
    }

    .start-btn:hover {
      opacity: 0.94;
    }

    .start-btn:active {
      transform: scale(0.99);
    }

    /* Play Icon: 24 × 30 px in Pure Black */
    .start-btn svg {
      width: 24px;
      height: 30px;
      display: block;
      flex-shrink: 0;
      fill: var(--text-black);
    }

    /* ── Mobile Viewports ────────────────────────────────────────── */
    @media (max-width: 480px) {
      body {
        padding: 0;
      }
      .card {
        border-radius: 0;
        border: none;
        max-width: 100vw;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        max-height: 100dvh;
        margin: 0 auto;
        padding: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

<main class="card" aria-label="Workout Timer Configuration">

  <!-- Top Section: Header & Tabs in Volt Green (#99FF44) -->
  <div class="top-section-home">

    <!-- Group A: Header (375 × 83 px) -->
    <header class="header">
      <div class="header-text">
        <h1>Workout Timer</h1>
      </div>
      <a href="settings.html" class="settings-btn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
    </header>

    <!-- Group B: Workout Tabs (375 × 84 px) -->
    <nav class="tabs-bar" id="tabs-container" role="tablist" aria-label="Workout Tabs">
      <div class="tab-wrapper" data-tab-id="1">
        <button class="tab active" role="tab" aria-selected="true" data-tab="1">
          <span class="tab-title">WORKOUT 1</span>
          <span class="tab-remove" title="Remove Workout" aria-label="Remove Workout">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M5 5L11 11M11 5L5 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
        </button>
      </div>
      <button class="tab-add" id="tab-add-btn" aria-label="Add Workout" title="Add Workout">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </nav>

  </div>

  <!-- Group C: Setting Cards (6 Cards) -->
  <section class="params" id="params" aria-label="Workout Parameters">

    <!-- 0. PREPARATION TIME (Default: 5 SEC) -->
    <div class="card-row" data-target="prep">
      <button class="card-action-btn minus" data-target="prep" data-dir="-1" aria-label="Decrease preparation time">
        <span class="glyph-minus" aria-hidden="true"></span>
      </button>
      <div class="card-center">
        <span class="card-label">PREPARATION TIME (SEC)</span>
        <span class="card-value" id="prep-val-display">5</span>
      </div>
      <button class="card-action-btn plus" data-target="prep" data-dir="1" aria-label="Increase preparation time">
        <span class="glyph-plus" aria-hidden="true">
          <svg viewBox="0 0 18 18" fill="none">
            <path d="M9 2.5v13M2.5 9h13"/>
          </svg>
        </span>
      </button>
      <input type="number" id="prep-val" value="5" min="0" max="60" style="display:none;" />
    </div>

    <!-- 1. SETS (Default: 3) -->
    <div class="card-row" data-target="sets">
      <button class="card-action-btn minus" data-target="sets" data-dir="-1" aria-label="Decrease sets">
        <span class="glyph-minus" aria-hidden="true"></span>
      </button>
      <div class="card-center">
        <span class="card-label">SETS</span>
        <span class="card-value" id="sets-val-display">3</span>
      </div>
      <button class="card-action-btn plus" data-target="sets" data-dir="1" aria-label="Increase sets">
        <span class="glyph-plus" aria-hidden="true">
          <svg viewBox="0 0 18 18" fill="none">
            <path d="M9 2.5v13M2.5 9h13"/>
          </svg>
        </span>
      </button>
      <input type="number" id="sets-val" value="3" min="1" max="99" style="display:none;" />
    </div>

    <!-- 2. REST BETWEEN SETS (Default: 10 SEC) -->
    <div class="card-row" data-target="rest-sets">
      <button class="card-action-btn minus" data-target="rest-sets" data-dir="-1" aria-label="Decrease rest between sets">
        <span class="glyph-minus" aria-hidden="true"></span>
      </button>
      <div class="card-center">
        <span class="card-label">REST BETWEEN SETS (SEC)</span>
        <span class="card-value" id="rest-sets-val-display">10</span>
      </div>
      <button class="card-action-btn plus" data-target="rest-sets" data-dir="1" aria-label="Increase rest between sets">
        <span class="glyph-plus" aria-hidden="true">
          <svg viewBox="0 0 18 18" fill="none">
            <path d="M9 2.5v13M2.5 9h13"/>
          </svg>
        </span>
      </button>
      <input type="number" id="rest-sets-val" value="10" min="0" max="600" style="display:none;" />
    </div>

    <!-- 3. REPS PER SET (Default: 10) -->
    <div class="card-row" data-target="reps">
      <button class="card-action-btn minus" data-target="reps" data-dir="-1" aria-label="Decrease reps per set">
        <span class="glyph-minus" aria-hidden="true"></span>
      </button>
      <div class="card-center">
        <span class="card-label">REPS PER SET</span>
        <span class="card-value" id="reps-val-display">10</span>
      </div>
      <button class="card-action-btn plus" data-target="reps" data-dir="1" aria-label="Increase reps per set">
        <span class="glyph-plus" aria-hidden="true">
          <svg viewBox="0 0 18 18" fill="none">
            <path d="M9 2.5v13M2.5 9h13"/>
          </svg>
        </span>
      </button>
      <input type="number" id="reps-val" value="10" min="1" max="99" style="display:none;" />
    </div>

    <!-- 4. REST BETWEEN REPS (Default: 5 SEC) -->
    <div class="card-row" data-target="rest-reps">
      <button class="card-action-btn minus" data-target="rest-reps" data-dir="-1" aria-label="Decrease rest between reps">
        <span class="glyph-minus" aria-hidden="true"></span>
      </button>
      <div class="card-center">
        <span class="card-label">REST BETWEEN REPS (SEC)</span>
        <span class="card-value" id="rest-reps-val-display">5</span>
      </div>
      <button class="card-action-btn plus" data-target="rest-reps" data-dir="1" aria-label="Increase rest between reps">
        <span class="glyph-plus" aria-hidden="true">
          <svg viewBox="0 0 18 18" fill="none">
            <path d="M9 2.5v13M2.5 9h13"/>
          </svg>
        </span>
      </button>
      <input type="number" id="rest-reps-val" value="5" min="0" max="300" style="display:none;" />
    </div>

    <!-- 5. HOLD TIME (Default: 10 SEC) -->
    <div class="card-row" data-target="hold">
      <button class="card-action-btn minus" data-target="hold" data-dir="-1" aria-label="Decrease hold time">
        <span class="glyph-minus" aria-hidden="true"></span>
      </button>
      <div class="card-center">
        <span class="card-label">HOLD TIME (SEC)</span>
        <span class="card-value" id="hold-val-display">10</span>
      </div>
      <button class="card-action-btn plus" data-target="hold" data-dir="1" aria-label="Increase hold time">
        <span class="glyph-plus" aria-hidden="true">
          <svg viewBox="0 0 18 18" fill="none">
            <path d="M9 2.5v13M2.5 9h13"/>
          </svg>
        </span>
      </button>
      <input type="number" id="hold-val" value="10" min="0" max="300" style="display:none;" />
    </div>

    <!-- Hidden audio toggles for backward compatibility and config persistence -->
    <input type="checkbox" id="sound-sets" checked style="display:none;" />
    <input type="checkbox" id="sound-rest-sets" checked style="display:none;" />
    <input type="checkbox" id="sound-reps" checked style="display:none;" />
    <input type="checkbox" id="sound-rest-reps" checked style="display:none;" />
    <input type="checkbox" id="sound-hold" checked style="display:none;" />

  </section>

  <!-- Group D: CTA Button (375 × 83 px, Neon Volt Green #99FF44) -->
  <footer class="start-btn-wrap">
    <button class="start-btn" id="start-btn" aria-label="Start Workout" title="Start Workout">
      <svg viewBox="0 0 24 30" aria-hidden="true">
        <path d="M0 0L24 15L0 30V0Z" />
      </svg>
    </button>
  </footer>

</main>

<script>
  // ── State ────────────────────────────────────────────────────
  const state = {
    prep:        { value: 5,  min: 0, max: 60  },
    sets:        { value: 3,  min: 1, max: 99  },
    'rest-sets': { value: 10, min: 0, max: 600 },
    reps:        { value: 10, min: 1, max: 99  },
    'rest-reps': { value: 5,  min: 0, max: 300 },
    hold:        { value: 10, min: 0, max: 300 },
  };

  const STORAGE_KEY = 'workout_timer_saved_config';

  // ── Persistence Helpers ──────────────────────────────────────
  function saveConfig() {
    try {
      const exerciseCount = tabsContainer.querySelectorAll('.tab-wrapper').length;
      const config = {
        prep:          state['prep'].value,
        sets:          state['sets'].value,
        restSets:      state['rest-sets'].value,
        reps:          state['reps'].value,
        restReps:      state['rest-reps'].value,
        hold:          state['hold'].value,
        exerciseCount: Math.max(1, exerciseCount),
        soundSets:     true,
        soundRestSets: true,
        soundReps:     true,
        soundRestReps: true,
        soundHold:     true,
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
    } catch (e) {
      console.warn('Failed to save config to localStorage:', e);
    }
  }

  function loadConfig() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const cfg = JSON.parse(raw);

      if (typeof cfg.prep === 'number')      updateValue('prep', cfg.prep);
      if (typeof cfg.sets === 'number')      updateValue('sets', cfg.sets);
      if (typeof cfg.restSets === 'number')  updateValue('rest-sets', cfg.restSets);
      if (typeof cfg.reps === 'number')      updateValue('reps', cfg.reps);
      if (typeof cfg.restReps === 'number')  updateValue('rest-reps', cfg.restReps);
      if (typeof cfg.hold === 'number')      updateValue('hold', cfg.hold);

      // Restore saved exercise tabs
      if (cfg.exerciseCount && cfg.exerciseCount > 1) {
        tabsContainer.querySelectorAll('.tab-wrapper').forEach(w => w.remove());
        for (let i = 1; i <= cfg.exerciseCount; i++) {
          createWorkoutTab(i, i === 1);
        }
        updateRemoveButtons();
      }
    } catch (e) {
      console.warn('Failed to load config from localStorage:', e);
    }
  }

  // ── Helper to Update and Sync Stepper Value ───────────────────
  function updateValue(target, newVal) {
    const s = state[target];
    if (!s) return;
    const clamped = Math.min(s.max, Math.max(s.min, newVal));
    s.value = clamped;

    const display = document.getElementById(`${target}-val-display`);
    if (display) {
      display.textContent = clamped;
    }

    const input = document.getElementById(`${target}-val`);
    if (input) {
      input.value = clamped;
    }

    saveConfig();
  }

  function stepOnce(target, dir) {
    updateValue(target, state[target].value + dir);
  }

  // ── Stepper Press & Hold for High Speed Acceleration ─────────
  let holdTimer = null;
  let holdInterval = null;

  function startHoldStep(target, dir) {
    stepOnce(target, dir);

    holdTimer = setTimeout(() => {
      holdInterval = setInterval(() => {
        stepOnce(target, dir);
      }, 60);
    }, 320);
  }

  function stopHoldStep() {
    if (holdTimer)    { clearTimeout(holdTimer);   holdTimer = null; }
    if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
  }

  document.querySelectorAll('.card-action-btn').forEach(btn => {
    const target = btn.dataset.target;
    const dir    = parseInt(btn.dataset.dir, 10);

    // Mouse events
    btn.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      startHoldStep(target, dir);
    });
    btn.addEventListener('mouseup', stopHoldStep);
    btn.addEventListener('mouseleave', stopHoldStep);

    // Touch events for mobile
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startHoldStep(target, dir);
    }, { passive: false });
    btn.addEventListener('touchend', stopHoldStep);
    btn.addEventListener('touchcancel', stopHoldStep);
  });

  // ── Workout Tabs Management ──────────────────────────────────
  const tabsContainer = document.getElementById('tabs-container');
  const tabAddBtn     = document.getElementById('tab-add-btn');

  function createWorkoutTab(num, isActive = false) {
    const newWrapper = document.createElement('div');
    newWrapper.className = 'tab-wrapper';
    newWrapper.dataset.tabId = num;

    const newTab = document.createElement('button');
    newTab.className = `tab ${isActive ? 'active' : ''}`;
    newTab.role = 'tab';
    newTab.setAttribute('aria-selected', isActive ? 'true' : 'false');
    newTab.dataset.tab = num;
    newTab.innerHTML = `
      <span class="tab-title">WORKOUT ${num}</span>
      <span class="tab-remove" title="Remove Workout" aria-label="Remove Workout">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M5 5L11 11M11 5L5 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>`;

    newWrapper.appendChild(newTab);
    tabsContainer.insertBefore(newWrapper, tabAddBtn);
    return newTab;
  }

  function updateRemoveButtons() {
    const wrappers = tabsContainer.querySelectorAll('.tab-wrapper');
    wrappers.forEach(w => {
      const tab = w.querySelector('.tab');
      if (wrappers.length > 1) {
        tab.classList.add('has-remove');
      } else {
        tab.classList.remove('has-remove');
      }
    });
  }

  function renumberTabs() {
    const wrappers = tabsContainer.querySelectorAll('.tab-wrapper');
    wrappers.forEach((w, index) => {
      const num = index + 1;
      w.dataset.tabId = num;
      const btn = w.querySelector('.tab');
      btn.dataset.tab = num;
      btn.querySelector('.tab-title').textContent = `WORKOUT ${num}`;
    });
    updateRemoveButtons();
    saveConfig();
  }

  function setActiveTab(tabBtn) {
    tabsContainer.querySelectorAll('.tab').forEach(t => {
      t.classList.remove('active');
      t.setAttribute('aria-selected', 'false');
    });
    tabBtn.classList.add('active');
    tabBtn.setAttribute('aria-selected', 'true');
  }

  // Setup tab click delegation
  tabsContainer.addEventListener('click', (e) => {
    const removeBtn = e.target.closest('.tab-remove');
    if (removeBtn) {
      e.stopPropagation();
      const wrapper = removeBtn.closest('.tab-wrapper');
      const wasActive = wrapper.querySelector('.tab').classList.contains('active');
      wrapper.remove();
      renumberTabs();
      if (wasActive) {
        const firstTab = tabsContainer.querySelector('.tab');
        if (firstTab) setActiveTab(firstTab);
      }
      saveConfig();
      return;
    }

    const tabBtn = e.target.closest('.tab');
    if (tabBtn && tabBtn.dataset.tab) {
      setActiveTab(tabBtn);
    }
  });

  // ── Smooth Mouse Wheel Horizontal Scrolling ───────────────────
  tabsContainer.addEventListener('wheel', (e) => {
    if (e.deltaY !== 0) {
      e.preventDefault();
      tabsContainer.scrollLeft += e.deltaY * 0.9;
    }
  }, { passive: false });

  // ── Click & Drag Horizontal Scrolling for Desktop ─────────────
  let isDown = false;
  let startX = 0;
  let scrollLeft = 0;

  tabsContainer.addEventListener('mousedown', (e) => {
    if (e.target.closest('.tab-remove') || e.target.closest('.tab-add')) return;
    isDown = true;
    startX = e.pageX - tabsContainer.offsetLeft;
    scrollLeft = tabsContainer.scrollLeft;
  });

  tabsContainer.addEventListener('mouseleave', () => { isDown = false; });
  tabsContainer.addEventListener('mouseup', () => {
    setTimeout(() => { isDown = false; }, 50);
  });

  tabsContainer.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    const x = e.pageX - tabsContainer.offsetLeft;
    const walk = (x - startX) * 1.4;
    tabsContainer.scrollLeft = scrollLeft - walk;
  });

  // Add Workout Tab
  tabAddBtn.addEventListener('click', () => {
    const wrappers = tabsContainer.querySelectorAll('.tab-wrapper');
    const newNum = wrappers.length + 1;
    const newTab = createWorkoutTab(newNum, true);

    setActiveTab(newTab);
    updateRemoveButtons();
    newTab.scrollIntoView({ behavior: 'smooth', inline: 'nearest' });
    saveConfig();
  });

  updateRemoveButtons();

  // ── Restore Previous Exercise Values ──────────────────────────
  loadConfig();

  // ── Start Workout Button ──────────────────────────────────────
  document.getElementById('start-btn').addEventListener('click', () => {
    saveConfig();
    const workoutCount = tabsContainer.querySelectorAll('.tab-wrapper').length;

    const p = new URLSearchParams({
      prep:          state['prep'].value,
      sets:          state['sets'].value,
      reps:          state['reps'].value,
      restSets:      state['rest-sets'].value,
      restReps:      state['rest-reps'].value,
      hold:          state['hold'].value,
      exercises:     workoutCount,
      soundSets:     '1',
      soundRestSets: '1',
      soundReps:     '1',
      soundRestReps: '1',
      soundHold:     '1',
    });

    location.href = `timer.html?${p.toString()}`;
  });
</script>

</body>
</html>
