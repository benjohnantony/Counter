<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Timer — Active</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /*
     * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     *  FIGMA WORKOUT TIMER V2 — PROGRESS SCREEN (ID: 56:2273)
     *  Brutalist Athletic High-Visibility Theme
     * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Colors directly from Figma Workout Timer v2 */
      --bg:             #000000; /* Main surface */
      --card-surface:   #000000;
      --card-border:    #FFFFFF;
      --control-border: #303038;
      --accent-green:   #99FF44; /* Neon lime */
      --accent-yellow:  #FFE600; /* Vibrant athletic yellow for REST */
      --accent-red:     #F13629; /* Vibrant red */
      --accent-red-header: #F1372A; /* Close header button */
      --stop-red:       #FF003B;
      --cat-amber:      #FFAB00; /* Rest amber */
      --white:          #FFFFFF;
      --primary-text:   #F5F5F7;
      --text-black:     #000000;
      --subtitle-text:  #9E9E9F;
      --muted-text:     #727287;

      /* Typography */
      --font-heading:   'Anton', sans-serif;
      --font-body:      'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* Radii */
      --r-none:         0px;
      --r-pill:         360px;

      --transition:     0.15s ease;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--primary-text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0;
      background: var(--bg);
    }

    /* ── Mobile Container ────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      border-radius: var(--r-none);
      border: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    /* ── Top Header Section ───────────────────────────────────────── */
    .top-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background: var(--bg);
    }

    /* Group A: Clock + Close Button */
    .header-bar {
      width: 100%;
      height: clamp(54px, 8.5vh, 83px);
      min-height: 54px;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      border: none;
      background: #000000;
    }

    .header-text {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 clamp(16px, 4vw, 32px) 0 clamp(14px, 4vw, 20px);
      background: #000000;
    }

    .header-clock {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: clamp(20px, 3vh, 24px);
      line-height: 1;
      letter-spacing: 1.2px;
      color: var(--white);
      font-variant-numeric: tabular-nums;
      margin: 0;
    }

    .header-subtitle {
      display: none;
    }

    /* Close Button (Red Block #F1372A) */
    .header-btn {
      width: clamp(70px, 11vh, 93px);
      height: 100%;
      background: var(--accent-red-header); /* #F1372A */
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--white);
      flex-shrink: 0;
      padding: 0;
      transition: opacity var(--transition);
      -webkit-tap-highlight-color: transparent;
    }

    .header-btn:hover {
      opacity: 0.9;
    }

    .header-btn svg {
      width: clamp(16px, 2.5vh, 20px);
      height: clamp(16px, 2.5vh, 20px);
      stroke: var(--white);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Center Hero Stage (Figma v2 Frame 1707479700: 375 × 583 px) ─ */
    .center-section {
      width: 100%;
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      padding: 0;
      box-sizing: border-box;
      background-color: var(--accent-green); /* Neon Volt Green base #99FF44 for HOLD */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background-color 0.25s ease;
    }

    .center-section.resting {
      background-color: var(--accent-yellow); /* Vibrant Yellow base #FFE600 for REST */
    }

    /* Do not fade or desaturate colors when paused */
    .card.paused .center-section {
      /* preserved original high contrast */
    }

    /* Progress Overlay:
       Black overlay with 20% opacity.
       Initially at 0% (at the bottom).
       Fills upward during HOLD (0% -> 100%).
       Empties downward during REST (100% -> 0%). */
    .stage-progress-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.2);
      pointer-events: none;
      z-index: 1;
      clip-path: inset(100% 0 0 0); /* Starts at bottom (0% fill) */
      will-change: clip-path;
      transition: clip-path 0.04s linear;
    }

    /* ── Top Unified 3-Column Metrics Bar (Inside Neon Green Space) ── */
    .metrics-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: clamp(52px, 7.5vh, 64px);
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: none;
      background: transparent;
      flex-shrink: 0;
      z-index: 5;
      padding: clamp(6px, 1.2vh, 12px) 0 clamp(4px, 0.8vh, 8px);
      box-sizing: border-box;
    }

    .metric-col {
      flex: 1;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      padding: 0 4px;
      box-sizing: border-box;
      user-select: none;
    }

    .metric-divider {
      width: 1.5px;
      height: 30px;
      background: rgba(0, 0, 0, 0.22);
      flex-shrink: 0;
    }

    .metric-val {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: clamp(20px, 3vh, 24px);
      line-height: 1.1;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #000000;
    }

    .metric-total {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: clamp(16px, 2.3vh, 18px);
      line-height: 1.1;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.75);
    }

    /* ── Center Stage & Giant Countdown Timer ── */
    .stage-center-wrap {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .stage-timer-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .stage-timer-digits {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: clamp(58px, min(24vw, 14vh), 100px);
      line-height: 1;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      color: var(--text-black);
      transition: transform 0.15s ease;
      will-change: transform;
    }

    .stage-timer-digits.pop {
      transform: scale(1.05);
    }

    /* ── Red Command Banner / Action Runway Ticker (Figma Node 84-151) ── */
    .command-banner {
      width: 100%;
      height: clamp(64px, 10.3vh, 84px);
      min-height: 64px;
      background: var(--accent-red); /* #FF003B / #F13629 */
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 0;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .runway-side {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
      transition: opacity 0.2s ease;
    }

    .runway-side.left {
      justify-content: flex-end;
      -webkit-mask-image: linear-gradient(to right, rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 1) 24px, rgba(0, 0, 0, 1) calc(100% - 36px), rgba(0, 0, 0, 0) 100%);
      mask-image: linear-gradient(to right, rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 1) 24px, rgba(0, 0, 0, 1) calc(100% - 36px), rgba(0, 0, 0, 0) 100%);
    }

    .runway-side.right {
      justify-content: flex-start;
      -webkit-mask-image: linear-gradient(to right, rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 1) 36px, rgba(0, 0, 0, 1) calc(100% - 24px), rgba(0, 0, 0, 0) 100%);
      mask-image: linear-gradient(to right, rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 1) 36px, rgba(0, 0, 0, 1) calc(100% - 24px), rgba(0, 0, 0, 0) 100%);
    }

    .runway-svg {
      width: 576px;
      height: 100%;
      flex-shrink: 0;
      display: block;
      will-change: transform;
      fill: rgba(255, 255, 255, 0.28); /* Exact Figma chevron color: #F45E54 over #F13629 */
      transition: fill 0.2s ease;
    }

    .runway-side.left .runway-svg {
      margin-right: -48px;
    }

    .runway-side.right .runway-svg {
      margin-left: -48px;
    }

    .arrow-inward {
      display: none;
    }

    .arrow-outward {
      display: block;
    }

    .command-center-wrap {
      padding: 0 clamp(10px, 2.5vw, 18px);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    .command-badge {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: clamp(20px, 3vh, 26px);
      line-height: 1.1;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #FFFFFF;
      text-align: center;
      user-select: none;
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
      transition: color 0.2s ease;
    }

    .command-badge.animate-pop {
      animation: cmdPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes cmdPop {
      0%   { transform: scale(0.8); opacity: 0.5; }
      60%  { transform: scale(1.16); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ── Mode 1: OUTWARD (GO!) ── */
    .command-banner.mode-outward .arrow-outward,
    .command-banner.mode-hold .arrow-outward {
      display: block;
    }

    .command-banner.mode-outward .arrow-inward,
    .command-banner.mode-hold .arrow-inward {
      display: none;
    }

    .command-banner.mode-outward .runway-side.left .runway-svg,
    .command-banner.mode-hold .runway-side.left .runway-svg {
      animation: streamOutwardLeft 0.8s linear infinite;
    }

    .command-banner.mode-outward .runway-side.right .runway-svg,
    .command-banner.mode-hold .runway-side.right .runway-svg {
      animation: streamOutwardRight 0.8s linear infinite;
    }

    @keyframes streamOutwardLeft {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-48px); }
    }

    @keyframes streamOutwardRight {
      0%   { transform: translateX(0); }
      100% { transform: translateX(48px); }
    }

    /* ── Mode 2: HOLD (Freeze in exact moment & position) ── */
    .command-banner.mode-hold .runway-svg {
      animation-play-state: paused !important;
    }

    /* ── Mode 3: INWARD (REST & SET REST) ── */
    .command-banner.mode-inward .arrow-outward {
      display: none;
    }

    .command-banner.mode-inward .arrow-inward {
      display: block;
    }

    .command-banner.mode-inward .runway-side.left .runway-svg {
      animation: streamInwardLeft 0.8s linear infinite;
    }

    .command-banner.mode-inward .runway-side.right .runway-svg {
      animation: streamInwardRight 0.8s linear infinite;
    }

    @keyframes streamInwardLeft {
      0%   { transform: translateX(0); }
      100% { transform: translateX(48px); }
    }

    @keyframes streamInwardRight {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-48px); }
    }

    /* ── Mode 4: PAUSED (Yellow Background + Clean Text Only, No Arrows) ── */
    .command-banner.mode-paused,
    #card.paused .command-banner {
      background: #FFD000 !important; /* Athletic Pause Yellow */
      color: #000000 !important;
    }

    .command-banner.mode-paused .command-badge,
    #card.paused .command-banner .command-badge {
      color: #000000 !important;
      letter-spacing: 2.5px;
    }

    .command-banner.mode-paused .runway-side,
    #card.paused .command-banner .runway-side {
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* ── Mode 5: NO ARROWS (PREPARATION & COMPLETE) ── */
    .command-banner.mode-no-arrows .runway-side {
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* ── Controls Section (Figma v2 Frame 1707479676) ── */
    .controls {
      width: 100%;
      height: clamp(58px, 8.5vh, 83px);
      min-height: 58px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: stretch;
      flex-shrink: 0;
      background: #000000;
      border: none;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }

    .ctrl-col {
      display: contents;
    }

    .ctrl-btn-block {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      border: none;
      cursor: pointer;
      color: var(--white);
      padding: 0;
      margin: 0;
      transition: filter var(--transition), background var(--transition);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    .ctrl-btn-block:hover {
      filter: brightness(1.15);
    }

    .ctrl-btn-block:active {
      filter: brightness(0.9);
    }

    .ctrl-btn-block.center-play {
      background: var(--accent-green); /* Neon volt green #99FF44 */
      color: var(--text-black);
    }

    /* Pause button remains volt green #99FF44 matching theme */
    .ctrl-btn-block.center-play.paused {
      background: var(--accent-green);
    }

    .ctrl-btn-block svg {
      width: clamp(20px, 3vh, 24px);
      height: clamp(20px, 3vh, 24px);
      display: block;
    }

    .ctrl-btn-block svg:not([fill="none"]) {
      fill: currentColor;
    }

    .ctrl-btn-block.stop-col svg {
      fill: var(--stop-red); /* #FF003B */
      width: clamp(20px, 3vh, 24px);
      height: clamp(20px, 3vh, 24px);
    }

    .ctrl-label {
      display: none;
    }

    /* ── Voice Toast ─────────────────────────────────────────────── */
    .voice-toast {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(0, 0, 0, 0.95);
      border: 1px solid #FFFFFF;
      color: var(--white);
      font-family: var(--font-heading);
      font-size: 14px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: var(--r-none);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
      white-space: nowrap;
    }

    .voice-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Hide scrollbars across all browsers ─────────────────────── */
    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    *::-webkit-scrollbar {
      display: none;
    }

    /* ── BOTTOM OVERLAY MODAL (Figma Node 77-49) ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 1000;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      box-sizing: border-box;
      background: #000000;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-left: none;
      border-right: none;
      border-bottom: none;
      border-radius: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 -12px 48px rgba(0, 0, 0, 0.9);
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: calc(100dvh - 70px);
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-close-btn {
      position: absolute;
      top: -83px;
      right: 0;
      width: clamp(70px, 11vh, 93px);
      height: 83px;
      background: #F1372A;
      border: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      z-index: 10;
      transition: opacity var(--transition);
      -webkit-tap-highlight-color: transparent;
    }

    .modal-close-btn:hover {
      opacity: 0.9;
    }

    .modal-close-btn svg {
      width: clamp(16px, 2.5vh, 20px);
      height: clamp(16px, 2.5vh, 20px);
      stroke: #FFFFFF;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .modal-body {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: clamp(16px, 2.4vh, 26px) 20px clamp(14px, 2vh, 22px);
      box-sizing: border-box;
    }

    .modal-ill {
      height: clamp(130px, 18vh, 175px);
      width: auto;
      max-width: 220px;
      object-fit: contain;
      margin-bottom: clamp(10px, 1.4vh, 16px);
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 4px 16px rgba(255, 255, 255, 0.12));
    }

    .modal-title {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: clamp(20px, 2.8vh, 24px);
      line-height: 1.15;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #FFFFFF;
      margin: 0 0 clamp(6px, 1vh, 8px);
      text-align: center;
    }

    .modal-subtitle {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: clamp(12px, 1.6vh, 13px);
      line-height: 1.4;
      color: #9E9E9E;
      text-align: center;
      max-width: 290px;
      margin: 0;
    }

    .modal-subtitle .highlight-green {
      color: #99FF44;
      font-weight: 700;
    }

    .modal-action-bar {
      width: 100%;
      height: 83px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      box-sizing: border-box;
    }

    .modal-action-btn {
      height: 83px;
      border: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: filter 0.15s ease;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-action-btn:hover {
      filter: brightness(1.1);
    }

    .modal-action-btn.btn-restart {
      background: #000000;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
    }

    .modal-action-btn.btn-restart svg {
      width: 28px;
      height: 18px;
      stroke: currentColor;
    }

    .modal-action-btn.btn-home {
      background: #99FF44;
      color: #000000;
    }

    .modal-action-btn.btn-home svg {
      width: 36px;
      height: 36px;
      fill: #000000;
    }

    .modal-action-btn.btn-next {
      background: #99FF44;
      color: #000000;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
    }

    .modal-action-btn.btn-next svg {
      width: 24px;
      height: 24px;
      fill: #000000;
    }

    .modal-action-btn.btn-pause-toggle {
      background: #000000;
      color: #FFFFFF;
    }

    .modal-action-btn.btn-pause-toggle svg {
      width: 24px;
      height: 24px;
      fill: #FFFFFF;
    }

    .modal-action-btn.btn-stop {
      background: #000000;
      color: #FF003B;
    }

<script>
  /* ══════════════════════════════════════════════════════════════
   *  LOAD USER SETTINGS
   * ══════════════════════════════════════════════════════════════ */
  const SETTINGS_STORAGE_KEY = 'workout_timer_settings';
  const DEFAULT_SETTINGS = {
    soundEnabled:    true,
    voiceURI:        'default',
    language:        'en-US',
    speed:           1.0,
    volume:          80,
    prepTime:        10,
    keepScreenAwake: true,
    voiceCommands:   false,
    countdownBeeps:  true,
    countdownStyle:  'default',
    delayTime:       2,
    workoutDelay:    60,
    cueToggles: {
      sets:     true,
      restSets: true,
      reps:     true,
      restReps: true,
      hold:     true,
    },
    cueNames: {
      sets:     'Set',
      restSets: 'Rest',
      reps:     'Rep',
      restReps: 'Rest',
      hold:     'Hold',
    },
  };

  let SETTINGS = { ...DEFAULT_SETTINGS };
  try {
    const rawSettings = localStorage.getItem(SETTINGS_STORAGE_KEY);
    if (rawSettings) {
      const parsed = JSON.parse(rawSettings);
      SETTINGS = {
        ...DEFAULT_SETTINGS,
        ...parsed,
        cueToggles: { ...DEFAULT_SETTINGS.cueToggles, ...(parsed.cueToggles || {}) },
        cueNames:   { ...DEFAULT_SETTINGS.cueNames,   ...(parsed.cueNames || {}) },
      };
    }
  } catch (e) {
    console.warn('Failed to load settings:', e);
  }

  /* ══════════════════════════════════════════════════════════════
   *  CONFIG — read from URL params (fallback to settings/defaults)
   * ══════════════════════════════════════════════════════════════ */
  const p = new URLSearchParams(location.search);
  function getPositiveInt(val, fallback) {
    const n = parseInt(val, 10);
    return (!isNaN(n) && n > 0) ? n : fallback;
  }
  function getNonNegativeInt(val, fallback) {
    const n = parseInt(val, 10);
    return (!isNaN(n) && n >= 0) ? n : fallback;
  }

  const prepParam = p.get('prep');
  const CFG = {
    prep:          prepParam !== null ? getNonNegativeInt(prepParam, 10) : getNonNegativeInt(SETTINGS.prepTime, 10),
    sets:          Math.max(1, getPositiveInt(p.get('sets'), 3)),
    reps:          Math.max(1, getPositiveInt(p.get('reps'), 10)),
    restSets:      getNonNegativeInt(p.get('restSets'), 10),
    restReps:      getNonNegativeInt(p.get('restReps'), 5),
    hold:          getNonNegativeInt(p.get('hold'), 10),
    exercises:     getPositiveInt(p.get('exercises'), 1),
    soundSets:     p.get('soundSets') !== '0',
    soundRestSets: p.get('soundRestSets') !== '0',
    soundReps:     p.get('soundReps') !== '0',
    soundRestReps: p.get('soundRestReps') === '1',
    soundHold:     p.get('soundHold') !== '0',
  };

  // Sync to LocalStorage
  const STORAGE_KEY = 'workout_timer_saved_config';
  let workoutsList = [];
  try {
    const workoutsParam = p.get('workouts');
    if (workoutsParam) {
      workoutsList = JSON.parse(workoutsParam);
    } else {
      const rawStored = localStorage.getItem(STORAGE_KEY);
      if (rawStored) {
        const parsed = JSON.parse(rawStored);
        if (Array.isArray(parsed.workouts) && parsed.workouts.length > 0) {
          workoutsList = parsed.workouts;
        }
      }
    }
  } catch (e) {
    console.warn('Error parsing workouts list:', e);
  }

  function getWorkoutConfig(exIndex) {
    const idx = (exIndex || (state && state.exercise) || 1) - 1;
    if (workoutsList[idx]) {
      const w = workoutsList[idx];
      return {
        sets:     Math.max(1, typeof w.sets === 'number' ? w.sets : CFG.sets),
        reps:     Math.max(1, typeof w.reps === 'number' ? w.reps : CFG.reps),
        restSets: typeof w.restSets === 'number' ? w.restSets : CFG.restSets,
        restReps: typeof w.restReps === 'number' ? w.restReps : CFG.restReps,
        hold:     typeof w.hold === 'number' ? w.hold : CFG.hold,
      };
    }
    return {
      sets:     CFG.sets,
      reps:     CFG.reps,
      restSets: CFG.restSets,
      restReps: CFG.restReps,
      hold:     CFG.hold,
    };
  }

  // Keep screen awake
  let wakeLockSentinel = null;
  async function requestWakeLock() {
    if ('wakeLock' in navigator && SETTINGS.keepScreenAwake) {
      try {
        wakeLockSentinel = await navigator.wakeLock.request('screen');
      } catch (err) {
        console.warn('Wake Lock error:', err);
      }
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (wakeLockSentinel !== null && document.visibilityState === 'visible') {
      requestWakeLock();
    }
  });

  // Web Audio Tone Generator
  let audioCtx = null;
  let masterGain = null;
  let activeOscillators = [];

  function ensureAudioContext() {
    if (!audioCtx) {
      const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtxClass) return null;
      audioCtx = new AudioCtxClass();
      masterGain = audioCtx.createGain();
      masterGain.connect(audioCtx.destination);
    }
    return audioCtx;
  }

  function playTone(freq, duration = 0.12) {
    if (SETTINGS.soundEnabled === false) return;
    if (!SETTINGS.countdownBeeps) return;
    if (!state.running || state.finished) return; // STRICT GUARD: Never play tone when paused or finished
    try {
      const ctx = ensureAudioContext();
      if (!ctx || !masterGain) return;
      if (ctx.state === 'suspended' && state.running) {
        ctx.resume();
      }
      masterGain.gain.cancelScheduledValues(ctx.currentTime);
      masterGain.gain.setValueAtTime(1, ctx.currentTime);

      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);

      const vol = (parseFloat(SETTINGS.volume) || 80) / 100 * 0.35;
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

      osc.connect(gain);
      gain.connect(masterGain);
      osc.start();
      osc.stop(ctx.currentTime + duration);

      const nodePair = { osc, gain };
      activeOscillators.push(nodePair);
      osc.onended = () => {
        const idx = activeOscillators.indexOf(nodePair);
        if (idx !== -1) activeOscillators.splice(idx, 1);
      };
    } catch (e) {}
  }

  function stopAllAudio() {
    if (masterGain && audioCtx) {
      try {
        masterGain.gain.cancelScheduledValues(0);
        masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
      } catch (e) {}
    }
    activeOscillators.forEach(({ osc, gain }) => {
      try {
        osc.stop(0);
        osc.disconnect();
        gain.disconnect();
      } catch (e) {}
    });
    activeOscillators = [];
  }

  /* ══════════════════════════════════════════════════════════════
   *  AUDIO COACH & VOICE TIMING SYNCHRONIZATION
   * ══════════════════════════════════════════════════════════════ */
  let activeUtterance = null;
  let isCoachSpeaking = false;
  let coachSafetyTimer = null;

  function speakRaw(text, onComplete) {
    if (SETTINGS.soundEnabled === false) {
      if (onComplete) onComplete();
      return;
    }
    if (!('speechSynthesis' in window)) {
      if (onComplete) onComplete();
      return;
    }

    try {
      if (coachSafetyTimer) {
        clearTimeout(coachSafetyTimer);
        coachSafetyTimer = null;
      }
      window.speechSynthesis.cancel();

      // PHONETIC SANITIZATION:
      // Text-to-speech engines expand "rep" / "rep." to "representative" (abbreviation expansion).
      // Replacing with phonetic "repp" / "repps" guarantees the engine speaks /rɛp/ ("rep") and NEVER "representative"!
      const phoneticallyClean = (text || '')
        .replace(/\breps\b/gi, 'repps')
        .replace(/\brep\b/gi, 'repp')
        .replace(/\brepetition\b/gi, 'repp')
        .replace(/\brepetitions\b/gi, 'repps')
        .replace(/\brepresentative\b/gi, 'repp')
        .replace(/\brepresentatives\b/gi, 'repps');

      const u = new SpeechSynthesisUtterance(phoneticallyClean);
      u.rate   = parseFloat(SETTINGS.speed) || 1.0;
      u.pitch  = 1.05;
      u.volume = (parseFloat(SETTINGS.volume) || 80) / 100;
      u.lang   = SETTINGS.language || 'en-US';

      const voices = window.speechSynthesis.getVoices();
      if (SETTINGS.voiceURI && SETTINGS.voiceURI !== 'default') {
        const found = voices.find(v => v.voiceURI === SETTINGS.voiceURI);
        if (found) u.voice = found;
      } else {
        const langPrefix = (SETTINGS.language || 'en').split('-')[0];
        const enVoice = voices.find(v =>
          v.lang.startsWith(langPrefix) && (
            v.name.includes('Natural') ||
            v.name.includes('Google')  ||
            v.name.includes('Samantha')||
            v.name.includes('Daniel')  ||
            v.name.includes('Karen')
          )
        ) || voices.find(v => v.lang.startsWith(langPrefix)) || voices.find(v => v.lang.startsWith('en'));

        if (enVoice) u.voice = enVoice;
      }

      let called = false;
      const done = () => {
        if (called) return;
        called = true;
        isCoachSpeaking = false;
        if (coachSafetyTimer) {
          clearTimeout(coachSafetyTimer);
          coachSafetyTimer = null;
        }
        if (onComplete) onComplete();
      };

      u.onstart = () => { isCoachSpeaking = true; };
      u.onend   = () => { done(); };
      u.onerror = () => { done(); };

      const wordCount = (text || '').trim().split(/\s+/).filter(Boolean).length;
      const maxMs = Math.max(1200, wordCount * 650 + 900);
      coachSafetyTimer = setTimeout(done, maxMs);

      activeUtterance = u;
      setTimeout(() => {
        try {
          window.speechSynthesis.speak(u);
        } catch (err) {
          done();
        }
      }, 10);
    } catch (e) {
      isCoachSpeaking = false;
      console.warn('Speech error:', e);
      if (onComplete) onComplete();
    }
  }

  function getCueName(key) {
    if (SETTINGS.cueNames && typeof SETTINGS.cueNames[key] === 'string') {
      return SETTINGS.cueNames[key].trim();
    }
    const defaults = { sets: 'Set', reps: 'Rep', hold: 'Hold', restSets: 'Rest', restReps: 'Rest' };
    return defaults[key] || '';
  }

  function isCountEnabled(category) {
    if (SETTINGS.cueToggles && SETTINGS.cueToggles[category] === false) {
      return false;
    }
    if (category === 'hold' && CFG.soundHold === false) return false;
    if (category === 'sets' && CFG.soundSets === false) return false;
    if (category === 'reps' && CFG.soundReps === false) return false;
    if (category === 'restSets' && CFG.soundRestSets === false) return false;
    if (category === 'restReps' && CFG.soundRestReps === false) return false;
    return true;
  }
  const isCueEnabled = isCountEnabled;

  function speakPhaseCue(text, onSpeechDone) {
    if (!text || !text.trim() || SETTINGS.soundEnabled === false) {
      state.isWaitingForVoice = false;
      state.lastTickTime = performance.now();
      if (onSpeechDone) onSpeechDone();
      return;
    }

    state.isWaitingForVoice = true;
    speakRaw(text, () => {
      state.isWaitingForVoice = false;
      state.lastTickTime = performance.now();
      if (onSpeechDone) onSpeechDone();
    });
  }

  function shouldAnnounceCountdown(remSecs) {
    const style = SETTINGS.countdownStyle || 'default';
    if (style === 'default' || style === 'final3') {
      return remSecs <= 3;
    }
    if (style === 'smart') {
      if (remSecs <= 10) return true;
      return (remSecs % 10 === 0);
    }
    if (style === 'full') {
      return true;
    }
    return remSecs <= 3;
  }

  function speakCountdown(category, text) {
    if (!state.running || state.finished) return;
    if (SETTINGS.soundEnabled === false) return;
    if (!isCountEnabled(category)) return;
    speakRaw(text, null);
  }

  /* ══════════════════════════════════════════════════════════════
   *  DOM REFS & STATE
   * ══════════════════════════════════════════════════════════════ */
  const card            = document.getElementById('card');
  const centerSection   = document.getElementById('center-section');
  const workoutClock    = document.getElementById('workout-clock');
  const setInfoEl       = document.getElementById('set-info');
  const voiceToast      = document.getElementById('voice-toast');
  const stageFillOverlay= document.getElementById('stage-fill-overlay');

  const btnRepeat       = document.getElementById('btn-repeat');
  const btnPause        = document.getElementById('btn-pause');
  const btnStop         = document.getElementById('btn-stop');
  const iconPause       = document.getElementById('icon-pause');
  const iconPlay        = document.getElementById('icon-play');
  const pauseLabel      = document.getElementById('pause-label');

  const headerStopBtn   = document.getElementById('header-stop-btn');
  const stopModal       = document.getElementById('stop-modal');
  const modalRestartBtn = document.getElementById('modal-restart-btn');
  const modalResumeBtn  = document.getElementById('modal-resume-btn');
  const modalHomeBtn    = document.getElementById('modal-home-btn');

  const nextWorkoutModal    = document.getElementById('next-workout-modal');
  const nextWorkoutTitle    = document.getElementById('next-workout-title');
  const nextWorkoutSubtitle = document.getElementById('next-workout-subtitle');
  const nextWorkoutNextBtn  = document.getElementById('next-workout-next-btn') || document.getElementById('next-workout-start-btn');
  const nextWorkoutPauseBtn = document.getElementById('next-workout-pause-btn');

  const finishModal     = document.getElementById('finish-modal');
  const finishSubtitle  = document.getElementById('finish-subtitle');
  const finishRestartBtn= document.getElementById('finish-restart-btn');
  const finishHomeBtn   = document.getElementById('finish-home-btn');
  const finishSetupBtn  = document.getElementById('finish-setup-btn');

  const PHASE = {
    PREP:      'PREP',
    HOLD:      'HOLD',
    REST_REPS: 'REST_REPS',
    REST_SETS: 'REST_SETS',
    DONE:      'DONE',
  };

  let state = {
    exercise:          1,
    set:               1,
    rep:               1,
    phase:             CFG.prep > 0 ? PHASE.PREP : PHASE.HOLD,
    phaseDuration:     (CFG.prep > 0 ? CFG.prep : CFG.hold) * 1000,
    phaseElapsed:      0,
    running:           true,
    finished:          false,
    lastTickTime:      null,
    spokenCounts:      {},
    isWaitingForVoice: false,
    isCueSpeaking:     false,
    preModalState:     false,
  };

  function calculateTotalWorkoutDuration() {
    let totalSec = 0;
    const totalExercises = Math.max(1, CFG.exercises);
    for (let e = 1; e <= totalExercises; e++) {
      const exCfg = getWorkoutConfig(e);
      const setDuration = (exCfg.reps * exCfg.hold) + (Math.max(0, exCfg.reps - 1) * exCfg.restReps);
      const exerciseDuration = (exCfg.sets * setDuration) + (Math.max(0, exCfg.sets - 1) * exCfg.restSets);
      totalSec += exerciseDuration;
    }
    const totalPrep = (CFG.prep || 0) * totalExercises;
    return Math.max(1, totalSec + totalPrep);
  }

  let tickerId = null;
  let totalWorkoutSeconds = calculateTotalWorkoutDuration();
  let remainingWorkoutSeconds = totalWorkoutSeconds;
  let clockInterval = null;

  /* ══════════════════════════════════════════════════════════════
   *  COUNTDOWN CLOCK (Counts backwards from overall time)
   * ══════════════════════════════════════════════════════════════ */
  function startWorkoutClock() {
    if (clockInterval) clearInterval(clockInterval);
    updateClockDisplay();
    clockInterval = setInterval(() => {
      if (state.running && !state.finished) {
        if (remainingWorkoutSeconds > 0) {
          remainingWorkoutSeconds--;
        }
        updateClockDisplay();
      }
    }, 1000);
  }

  function updateClockDisplay() {
    const safeSecs = Math.max(0, remainingWorkoutSeconds);
    const hrs  = Math.floor(safeSecs / 3600);
    const mins = Math.floor((safeSecs % 3600) / 60);
    const secs = safeSecs % 60;
    const pad  = n => String(n).padStart(2, '0');
    workoutClock.textContent = `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
  }

  /* ── Stage Display & Liquid Loader Helpers ───────────────────── */
  let activeCommandBadge = 'GO!';
  function setStageBadge(text) {
    if (text === 'GET READY') text = 'GO!';
    if (text !== 'PAUSED') {
      activeCommandBadge = text;
    }
    const badge = document.getElementById('command-badge');
    const banner = document.getElementById('command-banner');

    if (badge) {
      badge.textContent = text;
      badge.classList.remove('animate-pop');
      void badge.offsetWidth;
      badge.classList.add('animate-pop');
    }

    if (banner) {
      banner.classList.remove('mode-outward', 'mode-hold', 'mode-inward', 'mode-paused', 'mode-no-arrows');
      if (text === 'PAUSED') {
        banner.classList.add('mode-paused');
        if (activeCommandBadge === 'REST' || activeCommandBadge.startsWith('SET REST')) {
          banner.classList.add('mode-inward');
        } else if (activeCommandBadge === 'PREPARATION' || activeCommandBadge === 'GREAT WORKOUT!' || activeCommandBadge === 'COMPLETE!') {
          banner.classList.add('mode-no-arrows');
        } else {
          banner.classList.add('mode-hold');
        }
      } else if (text === 'PREPARATION' || text === 'GREAT WORKOUT!' || text === 'COMPLETE!') {
        banner.classList.add('mode-no-arrows');
      } else if (text === 'REST' || text.startsWith('SET REST')) {
        banner.classList.add('mode-inward');
      } else if (text === 'GO!') {
        banner.classList.add('mode-outward');
      } else {
        // HOLD or active hold cue name -> freeze in position!
        banner.classList.add('mode-hold');
      }
    }

    // Also sync any lingering stage-phase-badge class elements if present
    document.querySelectorAll('.stage-phase-badge').forEach(el => el.textContent = text);
  }

  function setStageDigits(text) {
    document.querySelectorAll('.stage-timer-digits').forEach(el => el.textContent = text);
  }

  function setStageReps(current, total) {
    const repNum = document.getElementById('metric-rep-num');
    const repTotal = document.getElementById('metric-rep-total');
    if (repNum) repNum.textContent = `REP ${current}`;
    if (repTotal) repTotal.textContent = `OF ${total}`;
    document.querySelectorAll('.current-rep-num').forEach(el => el.textContent = current);
    document.querySelectorAll('.total-reps-num').forEach(el => el.textContent = total);
  }

  function popRepNumber() {
    document.querySelectorAll('.stage-timer-digits').forEach(el => {
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    });
    const repCol = document.getElementById('metric-rep-num');
    if (repCol) {
      repCol.style.transition = 'transform 0.15s ease';
      repCol.style.transform = 'scale(1.2)';
      setTimeout(() => { repCol.style.transform = 'scale(1)'; }, 180);
    }
  }

  /* Liquid fill:
     fraction = 0 -> inset(100% 0 0 0) [Completely empty]
     fraction = 1 -> inset(0% 0 0 0)   [Completely filled]
  */
  function setArcFill(fraction) {
    const clamped = Math.max(0, Math.min(1, fraction));
    if (stageFillOverlay) {
      stageFillOverlay.style.clipPath = `inset(${(1 - clamped) * 100}% 0 0 0)`;
    }
  }

  function updateWorkoutTitle() {
    const exCfg = getWorkoutConfig(state.exercise);

    const wrtNum = document.getElementById('metric-wrt-num');
    const wrtTotal = document.getElementById('metric-wrt-total');
    if (wrtNum) wrtNum.textContent = `WRT ${state.exercise}`;
    if (wrtTotal) wrtTotal.textContent = `OF ${CFG.exercises}`;

    const setNum = document.getElementById('metric-set-num');
    const setTotal = document.getElementById('metric-set-total');
    if (setNum) setNum.textContent = `SET ${state.set}`;
    if (setTotal) setTotal.textContent = `OF ${exCfg.sets}`;

    const repNum = document.getElementById('metric-rep-num');
    const repTotal = document.getElementById('metric-rep-total');
    if (repNum) repNum.textContent = `REP ${state.rep}`;
    if (repTotal) repTotal.textContent = `OF ${exCfg.reps}`;

    if (setInfoEl) {
      if (CFG.exercises > 1) {
        setInfoEl.textContent = `WORKOUT ${state.exercise} : SET ${state.set} OF ${exCfg.sets}`;
      } else {
        setInfoEl.textContent = `SET ${state.set} OF ${exCfg.sets}`;
      }
    }
  }

  /* ══════════════════════════════════════════════════════════════
   *  PHASE TRANSITIONS (With Audio Sequencing)
   * ══════════════════════════════════════════════════════════════ */
  function startPrep() {
    state.phase         = PHASE.PREP;
    state.phaseDuration = CFG.prep * 1000;
    state.phaseElapsed  = 0;
    state.spokenCounts  = {};
    state.isCueSpeaking = false;

    if (centerSection) centerSection.classList.remove('resting');

    setArcFill(0); // Starts empty
    setStageBadge('PREPARATION');
    const exCfg = getWorkoutConfig(1);
    setStageReps(1, exCfg.reps);

    const remSecs = Math.max(0, CFG.prep);
    const m = Math.floor(remSecs / 60);
    const s = remSecs % 60;
    setStageDigits(`00:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);
    popRepNumber();

    updateWorkoutTitle();
    speakRaw('Get ready.');
  }

  let activeDelayTimer = null;
  function clearActiveDelay() {
    if (activeDelayTimer) {
      clearTimeout(activeDelayTimer);
      activeDelayTimer = null;
    }
  }

  function startHold(repNum, isFirstOfSet = false, isFirstOfExercise = false) {
    clearActiveDelay();
    state.rep           = repNum;
    state.phase         = PHASE.HOLD;
    const exCfg         = getWorkoutConfig(state.exercise);
    state.phaseDuration = exCfg.hold * 1000;
    state.phaseElapsed  = 0;
    state.spokenCounts  = {};

    if (centerSection) centerSection.classList.remove('resting');

    setArcFill(0); // Section background starts empty, fills up to 100% during hold

    const holdDisplayName = getCueName('hold');
    // Initially show GO! during setup & silent delay
    setStageBadge('GO!');
    setStageReps(state.rep, exCfg.reps);
    
    const remSecs = Math.max(0, exCfg.hold);
    const m = Math.floor(remSecs / 60);
    const s = remSecs % 60;
    setStageDigits(`00:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);
    popRepNumber();

    updateWorkoutTitle();

    const setName   = getCueName('sets');
    const countSets = isCountEnabled('sets');
    const repName   = getCueName('reps');
    const countReps = isCountEnabled('reps');
    const holdName  = getCueName('hold');

    let cueParts = [];

    // Optional Workout # prefix if multi-workout
    if (isFirstOfExercise && CFG.exercises > 1) {
      cueParts.push(`Workout ${state.exercise}`);
    }

    // Set announcement (only on the first rep of a set)
    if (isFirstOfSet || isFirstOfExercise) {
      if (setName) {
        if (countSets) {
          cueParts.push(`${setName} ${state.set}`);
        } else {
          cueParts.push(setName);
        }
      }
    }

    // Rep announcement (every rep)
    if (repName) {
      if (countReps) {
        cueParts.push(`${repName} ${repNum}`);
      } else {
        cueParts.push(repName);
      }
    } else if (countReps) {
      cueParts.push(`${repNum}`);
    }

    // Execution trigger: spoken AFTER silent pose delay, starting countdown immediately
    const beginHoldCountdown = () => {
      clearActiveDelay();
      if (!state.running || state.finished) return;
      setStageBadge((holdDisplayName || 'HOLD').toUpperCase());
      if (SETTINGS.countdownBeeps && state.running) {
        playTone(1760, 0.2); // Crisp Go chime
      }

      if (holdName && exCfg.hold > 0) {
        state.isCueSpeaking = true;
        let holdDoneCalled = false;
        const onHoldDone = () => {
          if (holdDoneCalled) return;
          holdDoneCalled = true;
          state.isCueSpeaking = false;
          state.phaseElapsed = 0;
          state.lastTickTime = performance.now();
        };
        speakRaw(holdName, onHoldDone);
        activeDelayTimer = setTimeout(onHoldDone, 650);
      } else {
        state.isCueSpeaking = false;
        state.phaseElapsed = 0;
        state.lastTickTime = performance.now();
      }
    };

    state.isCueSpeaking = true;
    const delayMs = Math.max(0, parseInt(SETTINGS.delayTime, 10) || 0) * 1000;

    const onSetupCueDone = () => {
      if (delayMs > 0) {
        // Silent pose delay: give the user time to get into position
        activeDelayTimer = setTimeout(() => {
          activeDelayTimer = null;
          beginHoldCountdown();
        }, delayMs);
      } else {
        beginHoldCountdown();
      }
    };

    if (cueParts.length === 0) {
      onSetupCueDone();
      return;
    }

    const cueText = cueParts.join('. ') + '.';
    let cueFinished = false;
    const wrappedCueDone = () => {
      if (cueFinished) return;
      cueFinished = true;
      onSetupCueDone();
    };

    speakPhaseCue(cueText, wrappedCueDone);

    // Fallback timer: word count estimate + buffer
    const wordCount = cueText.trim().split(/\s+/).filter(Boolean).length;
    activeDelayTimer = setTimeout(wrappedCueDone, Math.max(1400, wordCount * 550 + 350));
  }

  function startRestReps() {
    clearActiveDelay();
    state.phase         = PHASE.REST_REPS;
    const exCfg         = getWorkoutConfig(state.exercise);
    state.phaseDuration = exCfg.restReps * 1000;
    state.phaseElapsed  = 0;
    state.spokenCounts  = {};

    if (centerSection) centerSection.classList.add('resting');

    setArcFill(1); // Starts full (100%), empties down to 0% during rest

    const restRepsName = getCueName('restReps');
    setStageBadge((restRepsName || 'REST').toUpperCase());
    const remSecs = Math.max(0, exCfg.restReps);
    const m = Math.floor(remSecs / 60);
    const s = remSecs % 60;
    setStageDigits(`00:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);
    popRepNumber();

    const beginRestCountdown = () => {
      clearActiveDelay();
      if (!state.running || state.finished) return;
      state.isCueSpeaking = false;
      state.phaseElapsed = 0;
      state.lastTickTime = performance.now();
    };

    state.isCueSpeaking = true;
    const delayMs = Math.max(0, parseInt(SETTINGS.delayTime, 10) || 0) * 1000;

    const onRestCueDone = () => {
      if (delayMs > 0) {
        // Silent rest delay: give the user time to release pose and return to normal position
        activeDelayTimer = setTimeout(() => {
          activeDelayTimer = null;
          beginRestCountdown();
        }, delayMs);
      } else {
        beginRestCountdown();
      }
    };

    if (!restRepsName) {
      onRestCueDone();
      return;
    }

    let cueFinished = false;
    const wrappedDone = () => {
      if (cueFinished) return;
      cueFinished = true;
      onRestCueDone();
    };

    speakPhaseCue(restRepsName, wrappedDone);
    activeDelayTimer = setTimeout(wrappedDone, 1200);
  }

  function startRestSets() {
    clearActiveDelay();
    state.phase         = PHASE.REST_SETS;
    const exCfg         = getWorkoutConfig(state.exercise);
    state.phaseDuration = exCfg.restSets * 1000;
    state.phaseElapsed  = 0;
    state.spokenCounts  = {};

    if (centerSection) centerSection.classList.add('resting');

    setArcFill(1); // Starts full (100%), empties down to 0% during rest

    const restSetsName  = getCueName('restSets');
    const setName       = getCueName('sets');
    const countSets     = isCountEnabled('sets');

    setStageBadge(('SET ' + (restSetsName || 'REST')).toUpperCase());
    const remSecs = Math.max(0, exCfg.restSets);
    const m = Math.floor(remSecs / 60);
    const s = remSecs % 60;
    setStageDigits(`00:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);
    popRepNumber();

    let cueParts = [];
    if (setName) {
      if (countSets) {
        cueParts.push(`${setName} ${state.set} complete`);
      } else {
        cueParts.push(`${setName} complete`);
      }
    }
    if (exCfg.restSets > 0 && restSetsName) {
      cueParts.push(restSetsName);
    }

    const beginRestCountdown = () => {
      clearActiveDelay();
      if (!state.running || state.finished) return;
      state.isCueSpeaking = false;
      state.phaseElapsed = 0;
      state.lastTickTime = performance.now();
    };

    state.isCueSpeaking = true;
    const delayMs = Math.max(0, parseInt(SETTINGS.delayTime, 10) || 0) * 1000;

    const onRestCueDone = () => {
      if (exCfg.restSets === 0) {
        // Zero rest between sets: announce completion then immediately start next set!
        state.set++;
        startHold(1, true);
        return;
      }
      if (delayMs > 0) {
        // Silent rest delay: give the user time to return to normal position
        activeDelayTimer = setTimeout(() => {
          activeDelayTimer = null;
          beginRestCountdown();
        }, delayMs);
      } else {
        beginRestCountdown();
      }
    };

    if (cueParts.length === 0) {
      onRestCueDone();
      return;
    }

    let cueFinished = false;
    const wrappedDone = () => {
      if (cueFinished) return;
      cueFinished = true;
      onRestCueDone();
    };

    const cueText = cueParts.join('. ') + '.';
    speakPhaseCue(cueText, wrappedDone);

    const wordCount = cueText.trim().split(/\s+/).filter(Boolean).length;
    activeDelayTimer = setTimeout(wrappedDone, Math.max(1400, wordCount * 550 + 350));
  }

  /* ══════════════════════════════════════════════════════════════
   *  TRANSITION / COMPLETE MODALS
   * ══════════════════════════════════════════════════════════════ */
  let transitionInterval = null;
  let transitionCountdown = 20;
  let transitionPaused = false;

  function proceedToNextWorkout() {
    if (transitionInterval) {
      clearInterval(transitionInterval);
      transitionInterval = null;
    }
    transitionPaused = false;
    if (nextWorkoutModal) nextWorkoutModal.classList.remove('active');
    state.exercise++;
    state.set = 1;
    state.rep = 1;
    state.running = true;
    card.classList.remove('paused');
    btnPause.classList.remove('paused');
    iconPause.style.display = '';
    iconPlay.style.display  = 'none';
    if (pauseLabel) pauseLabel.textContent = 'PAUSE';

    startTicker();
    if (CFG.prep > 0) {
      startPrep();
    } else {
      startHold(1, true, true);
    }
  }

  function updateTransitionCountdownUI(nextNum) {
    const formatted = `00:${String(Math.max(0, transitionCountdown)).padStart(2, '0')}`;
    if (nextWorkoutSubtitle) {
      if (transitionCountdown > 0) {
        nextWorkoutSubtitle.innerHTML = `Workout ${nextNum} starts in <span class="highlight-green" id="next-workout-timer">${formatted}</span>`;
      } else {
        nextWorkoutSubtitle.innerHTML = `Ready for Workout ${nextNum} of ${CFG.exercises}? Press Next to begin.`;
      }
    }
  }

  function showNextWorkoutPrompt() {
    state.running = false;
    stopTicker();
    stopAllAudio();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }

    const nextNum = state.exercise + 1;
    if (nextWorkoutTitle) nextWorkoutTitle.textContent = `WORKOUT ${state.exercise} COMPLETE!`;

    transitionCountdown = typeof SETTINGS.workoutDelay === 'number' ? SETTINGS.workoutDelay : 60;
    transitionPaused = false;

    const pauseIcon = document.getElementById('next-pause-icon');
    const playIcon  = document.getElementById('next-play-icon');
    if (pauseIcon) pauseIcon.style.display = '';
    if (playIcon) playIcon.style.display  = 'none';
    if (nextWorkoutPauseBtn) nextWorkoutPauseBtn.setAttribute('aria-label', 'Pause Delay');

    updateTransitionCountdownUI(nextNum);

    if (transitionInterval) clearInterval(transitionInterval);
    if (transitionCountdown > 0) {
      transitionInterval = setInterval(() => {
        if (!transitionPaused) {
          transitionCountdown--;
          updateTransitionCountdownUI(nextNum);
          if (transitionCountdown <= 0) {
            clearInterval(transitionInterval);
            transitionInterval = null;
            proceedToNextWorkout();
          }
        }
      }, 1000);
    }

    if (nextWorkoutModal) nextWorkoutModal.classList.add('active');
    speakRaw(`Workout ${state.exercise} complete. Ready for Workout ${nextNum}.`);
  }

  if (nextWorkoutNextBtn) {
    nextWorkoutNextBtn.onclick = () => {
      proceedToNextWorkout();
    };
  }

  if (nextWorkoutPauseBtn) {
    nextWorkoutPauseBtn.onclick = () => {
      transitionPaused = !transitionPaused;
      const pauseIcon = document.getElementById('next-pause-icon');
      const playIcon  = document.getElementById('next-play-icon');
      if (transitionPaused) {
        if (pauseIcon) pauseIcon.style.display = 'none';
        if (playIcon) playIcon.style.display = '';
        nextWorkoutPauseBtn.setAttribute('aria-label', 'Resume Delay');
      } else {
        if (pauseIcon) pauseIcon.style.display = '';
        if (playIcon) playIcon.style.display = 'none';
        nextWorkoutPauseBtn.setAttribute('aria-label', 'Pause Delay');
      }
    };
  }

  const nextWorkoutCloseBtn = document.getElementById('next-workout-close-btn');
  if (nextWorkoutCloseBtn) {
    nextWorkoutCloseBtn.onclick = () => {
      if (transitionInterval) { clearInterval(transitionInterval); transitionInterval = null; }
      if (nextWorkoutModal) nextWorkoutModal.classList.remove('active');
      openStopModal();
    };
  }

  function showWorkoutCompleteModal() {
    state.finished = true;
    state.running  = false;
    state.phase    = PHASE.DONE;
    stopTicker();
    stopAllAudio();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }

    remainingWorkoutSeconds = 0;
    updateClockDisplay();
    speakRaw('Workout complete. Fantastic job!');

    setArcFill(1);
    setStageDigits('✓');

    if (CFG.exercises > 1) {
      finishSubtitle.textContent = `You finished all ${CFG.exercises} exercises. Great Workout!`;
    } else {
      finishSubtitle.textContent = `You finished all ${CFG.sets} sets. Great Workout!`;
    }
    finishModal.classList.add('active');
  }

  function restartEntireWorkout() {
    clearActiveDelay();
    if (transitionInterval) {
      clearInterval(transitionInterval);
      transitionInterval = null;
    }
    if (nextWorkoutModal) nextWorkoutModal.classList.remove('active');
    if (finishModal) finishModal.classList.remove('active');
    state.finished = false;
    state.exercise = 1;
    state.set = 1;
    state.rep = 1;
    state.running = true;
    remainingWorkoutSeconds = totalWorkoutSeconds;
    updateClockDisplay();
    if (audioCtx && audioCtx.state === 'suspended') {
      try { audioCtx.resume(); } catch (e) {}
    }
    card.classList.remove('paused');
    btnPause.classList.remove('paused');
    iconPause.style.display = '';
    iconPlay.style.display  = 'none';
    if (pauseLabel) pauseLabel.textContent = 'PAUSE';
    startTicker();
    if (CFG.prep > 0) {
      startPrep();
    } else {
      startHold(1, true, true);
    }
  }

  /* ══════════════════════════════════════════════════════════════
   *  STOP MODAL
   * ══════════════════════════════════════════════════════════════ */
  function openStopModal() {
    if (state.finished) {
      location.href = 'index.html';
      return;
    }

    state.preModalState = state.running;
    state.running = false;
    stopTicker();
    stopAllAudio();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
    card.classList.add('paused');

    stopModal.classList.add('active');
    speakRaw('Workout paused.');
  }

  function closeStopModal() {
    stopModal.classList.remove('active');
    if (state.preModalState) {
      state.running = true;
      if (masterGain && audioCtx) {
        try { masterGain.gain.setValueAtTime(1, audioCtx.currentTime); } catch (e) {}
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        try { audioCtx.resume(); } catch (e) {}
      }
      card.classList.remove('paused');
      btnPause.classList.remove('paused');
      iconPause.style.display = '';
      iconPlay.style.display  = 'none';
      if (pauseLabel) pauseLabel.textContent = 'PAUSE';
      startTicker();
    }
  }

  modalRestartBtn.onclick = () => {
    stopModal.classList.remove('active');
    restartEntireWorkout();
  };

  modalResumeBtn.onclick = () => {
    closeStopModal();
  };

  modalHomeBtn.onclick = () => {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    location.href = 'index.html';
  };

  stopModal.addEventListener('click', (e) => {
    if (e.target === stopModal) closeStopModal();
  });

  headerStopBtn.addEventListener('click', openStopModal);

  // Finish Modal buttons
  finishRestartBtn.onclick = () => {
    finishModal.classList.remove('active');
    restartEntireWorkout();
  };

  finishHomeBtn.onclick = () => {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    location.href = 'index.html';
  };

  const finishCloseBtn = document.getElementById('finish-close-btn');
  if (finishCloseBtn) {
    finishCloseBtn.onclick = () => {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      location.href = 'index.html';
    };
  }

  if (finishSetupBtn) {
    finishSetupBtn.onclick = () => {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      location.href = 'index.html';
    };
  }

  /* ══════════════════════════════════════════════════════════════
   *  MAIN TICK LOOP (Smooth 40ms interval)
   * ══════════════════════════════════════════════════════════════ */
  function tick() {
    if (!state.running || state.finished) {
      stopTicker();
      stopAllAudio();
      return;
    }

    const now = performance.now();
    if (!state.lastTickTime) {
      state.lastTickTime = now;
      return;
    }

    const delta = now - state.lastTickTime;
    state.lastTickTime = now;

    // ── PREPARATION: Drains from 100% -> 0% ──
    if (state.phase === PHASE.PREP) {
      state.phaseElapsed += delta;
      const total = state.phaseDuration;
      const progress = total > 0 ? Math.min(1, state.phaseElapsed / total) : 1;

      setArcFill(1 - progress);

      const remSecs = Math.max(0, Math.ceil((total - state.phaseElapsed) / 1000));
      const m = Math.floor(remSecs / 60);
      const s = remSecs % 60;
      setStageDigits(`00:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);

      if (remSecs > 0 && remSecs <= 3 && !state.spokenCounts[remSecs]) {
        state.spokenCounts[remSecs] = true;
        speakRaw(String(remSecs));
        if (SETTINGS.countdownBeeps && state.running) playTone(880, 0.08);
      }

      if (progress >= 1) {
        if (SETTINGS.countdownBeeps && state.running) playTone(1760, 0.2);
        startHold(1, true, true);
      }
      return;
    }

    // ── HOLD: Fills 0% -> 100% (Goes UP from bottom) ──
    if (state.phase === PHASE.HOLD) {
      if (state.isCueSpeaking) {
        // While introductory voice cue (e.g. "Workout 1. Set 1. Rep 1.") is speaking,
        // do not advance hold count or speak seconds yet!
        return;
      }

      state.phaseElapsed += delta;
      const total = state.phaseDuration;
      const progress = total > 0 ? Math.min(1, state.phaseElapsed / total) : 1;

      setArcFill(progress);

      const remSecs = Math.max(0, Math.ceil((total - state.phaseElapsed) / 1000));
      const m = Math.floor(remSecs / 60);
      const s = remSecs % 60;
      setStageDigits(`00:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);

      // Voice countdown matching display going backwards (e.g. 5, 4, 3, 2, 1)
      if (remSecs > 0 && !state.spokenCounts[remSecs]) {
        state.spokenCounts[remSecs] = true;
        if (isCountEnabled('hold') && shouldAnnounceCountdown(remSecs)) {
          speakCountdown('hold', String(remSecs));
        }
        if (SETTINGS.countdownBeeps && state.running) playTone(880, 0.08);
      }

      const exCfg = getWorkoutConfig(state.exercise);
      if (progress >= 1) {
        if (SETTINGS.countdownBeeps && state.running) playTone(1760, 0.2);
        const isLastRepOfSet = state.rep >= exCfg.reps;
        const isLastSetOfEx  = state.set >= exCfg.sets;
        const isLastExercise = state.exercise >= CFG.exercises;

        if (!isLastRepOfSet) {
          if (exCfg.restReps > 0) {
            startRestReps();
          } else {
            startHold(state.rep + 1);
          }
        } else if (!isLastSetOfEx) {
          startRestSets();
        } else if (!isLastExercise) {
          showNextWorkoutPrompt();
        } else {
          showWorkoutCompleteModal();
        }
      }
      return;
    }

    // ── REST: Drains from 100% -> 0% (Comes back down from hold) ──
    if (state.phase === PHASE.REST_REPS || state.phase === PHASE.REST_SETS) {
      if (state.isCueSpeaking) {
        // While introductory voice cue (e.g. "Set 1 complete. Rest.") is speaking,
        // do not advance rest countdown yet!
        return;
      }

      state.phaseElapsed += delta;
      const total = state.phaseDuration;
      const progress = total > 0 ? Math.min(1, state.phaseElapsed / total) : 1;

      setArcFill(1 - progress);

      const remSecs = Math.max(0, Math.ceil((total - state.phaseElapsed) / 1000));
      const m = Math.floor(remSecs / 60);
      const s = remSecs % 60;
      setStageDigits(`00:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);

      // Voice countdown if enabled for rest phase
      if (remSecs > 0 && !state.spokenCounts[remSecs]) {
        state.spokenCounts[remSecs] = true;
        const restCategory = state.phase === PHASE.REST_REPS ? 'restReps' : 'restSets';
        if (isCountEnabled(restCategory) && shouldAnnounceCountdown(remSecs)) {
          speakCountdown(restCategory, String(remSecs));
        }
        if (SETTINGS.countdownBeeps && state.running) playTone(880, 0.08);
      }

      if (progress >= 1) {
        if (state.phase === PHASE.REST_REPS) {
          startHold(state.rep + 1);
        } else if (state.phase === PHASE.REST_SETS) {
          state.set++;
          startHold(1, true);
        }
      }
    }
  }

  function startTicker() {
    stopTicker();
    state.lastTickTime = performance.now();
    tickerId = setInterval(tick, 40);
  }

  function stopTicker() {
    if (tickerId) {
      clearInterval(tickerId);
      tickerId = null;
    }
    clearActiveDelay();
    state.lastTickTime = null;
  }

  /* ══════════════════════════════════════════════════════════════
   *  CONTROLS
   * ══════════════════════════════════════════════════════════════ */
  function togglePause() {
    if (state.finished) return;
    state.running = !state.running;

    if (state.running) {
      if (masterGain && audioCtx) {
        try { masterGain.gain.setValueAtTime(1, audioCtx.currentTime); } catch (e) {}
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        try { audioCtx.resume(); } catch (e) {}
      }
      speakRaw('Resuming.');
      state.lastTickTime = performance.now();
      startTicker();
    } else {
      stopTicker();
      stopAllAudio();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      speakRaw('Paused.');
      state.isWaitingForVoice = false;
    }

    const paused = !state.running;
    card.classList.toggle('paused', paused);
    btnPause.classList.toggle('paused', paused);
    iconPause.style.display = paused ? 'none' : '';
    iconPlay.style.display  = paused ? ''     : 'none';
    if (pauseLabel) pauseLabel.textContent  = paused ? 'RESUME' : 'PAUSE';
    btnPause.setAttribute('aria-label', paused ? 'Resume workout' : 'Pause workout');
    setStageBadge(paused ? 'PAUSED' : activeCommandBadge);
  }

  btnPause.addEventListener('click', togglePause);

  function repeatCurrentRep() {
    if (state.finished) return;
    startHold(state.rep);
    if (!state.running) {
      state.running = true;
      card.classList.remove('paused');
      btnPause.classList.remove('paused');
      iconPause.style.display = '';
      iconPlay.style.display  = 'none';
      if (pauseLabel) pauseLabel.textContent  = 'PAUSE';
      startTicker();
    }
  }

  btnRepeat.addEventListener('click', repeatCurrentRep);
  btnStop.addEventListener('click', openStopModal);

  /* ══════════════════════════════════════════════════════════════
   *  VOICE COMMANDS ENGINE (Hands-Free Control)
   * ══════════════════════════════════════════════════════════════ */
  let speechRec = null;
  let voiceToastTimeout = null;

  function showVoiceToast(cmdText) {
    voiceToast.textContent = `🎙️ Heard: "${cmdText}"`;
    voiceToast.classList.add('show');
    clearTimeout(voiceToastTimeout);
    voiceToastTimeout = setTimeout(() => {
      voiceToast.classList.remove('show');
    }, 1800);
  }

  function setupVoiceRecognition() {
    if (!SETTINGS.voiceCommands) return;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;

    try {
      speechRec = new SpeechRecognition();
      speechRec.continuous = true;
      speechRec.interimResults = false;
      speechRec.lang = 'en-US';

      speechRec.onresult = (event) => {
        if (isCoachSpeaking || ('speechSynthesis' in window && window.speechSynthesis.speaking)) {
          return;
        }

        const last = event.results.length - 1;
        const transcript = event.results[last][0].transcript.trim().toLowerCase();
        handleVoiceCommand(transcript);
      };

      speechRec.onerror = (e) => {
        if (e.error !== 'no-speech') {
          console.warn('Voice rec error:', e.error);
        }
      };

      speechRec.onend = () => {
        if (!state.finished) {
          try { speechRec.start(); } catch (err) {}
        }
      };

      speechRec.start();
    } catch (e) {
      console.warn('SpeechRec start failed:', e);
    }
  }

  function handleVoiceCommand(cmd) {
    console.log('Voice Command received:', cmd);

    if (stopModal.classList.contains('active')) {
      if (cmd.includes('restart') || cmd.includes('again') || cmd.includes('beginning')) {
        showVoiceToast('Restart');
        modalRestartBtn.click();
        return;
      }
      if (cmd.includes('home') || cmd.includes('exit') || cmd.includes('quit') || cmd.includes('stop')) {
        showVoiceToast('Home');
        modalHomeBtn.click();
        return;
      }
      if (cmd.includes('cancel') || cmd.includes('resume') || cmd.includes('back') || cmd.includes('continue')) {
        showVoiceToast('Resume');
        closeStopModal();
        return;
      }
    }

    if (cmd.includes('pause') || cmd.includes('wait') || cmd.includes('hold on')) {
      if (state.running) {
        showVoiceToast('Pause');
        togglePause();
      }
      return;
    }

    if (cmd.includes('resume') || cmd.includes('play') || cmd.includes('start') || cmd.includes('continue')) {
      if (!state.running && !stopModal.classList.contains('active') && !finishModal.classList.contains('active')) {
        showVoiceToast('Resume');
        togglePause();
      }
      return;
    }

    if (cmd.includes('repeat') || cmd.includes('restart') || cmd.includes('again')) {
      showVoiceToast('Repeat Rep');
      repeatCurrentRep();
      return;
    }

    if (cmd.includes('stop') || cmd.includes('quit') || cmd.includes('end')) {
      showVoiceToast('Stop');
      openStopModal();
      return;
    }

    if (cmd.includes('home') || cmd.includes('exit')) {
      showVoiceToast('Go to Home');
      location.href = 'index.html';
      return;
    }
  }

  /* ══════════════════════════════════════════════════════════════
   *  INITIALIZATION
   * ══════════════════════════════════════════════════════════════ */
  function init() {
    updateWorkoutTitle();
    startWorkoutClock();

    setArcFill(0);

    const exCfg = getWorkoutConfig(1);
    const initSecs = CFG.prep > 0 ? CFG.prep : exCfg.hold;
    const m = Math.floor(initSecs / 60);
    const s = initSecs % 60;
    setStageDigits(`00:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);
    setStageReps(1, exCfg.reps);

    requestWakeLock();
    setupVoiceRecognition();

    startTicker();
    if (CFG.prep > 0) {
      startPrep();
    } else {
      startHold(1, true, true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>

</body>
